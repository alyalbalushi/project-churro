name: Build Project Churro for Pixelbook Go (ATLAS)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode (fast_patch = ~6 min using latest release; full_build = ~30 min from scratch)'
        required: true
        default: 'full_build'
        type: choice
        options:
          - 'fast_patch'
          - 'full_build'
      apply_latest_ota:
        description: 'Apply Latest Google OTA Delta Before Building'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '0'

permissions:
  contents: write

jobs:
  build-churro-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize Free Disk Space (~100 GB Free)
        run: |
          sudo swapoff -a || true
          sudo rm -rf /mnt/swapfile /swapfile \
                      /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/aws-cli /usr/local/share/chromium /usr/lib/jvm
          sudo docker system prune -a -f --volumes || true
          sudo apt-get clean
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install & Verify Project Churro, LLVM 18 & SPIRV-Tools Dependencies
        if: ${{ inputs.build_mode == 'full_build' }}
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf >/dev/null || true
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf >/dev/null || true
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt || true
          fi
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true

          sudo apt-get -o Acquire::Retries=5 -o Acquire::Check-Valid-Until=false update

          # 1. Install exact Project Churro host dependencies (from lib/deps.sh)
          sudo apt-get -o Acquire::Retries=5 install -y --fix-missing \
            gdisk dosfstools parted grub-common grub-efi-amd64-bin cpio attr kmod openssl \
            curl wget git unzip zip jq python3 python3-pip python3-venv python3-mako python3-yaml python3-ply \
            binutils lz4 zstd xz-utils bzip2 build-essential flex bison bc rsync pkg-config \
            cmake ninja-build meson libssl-dev libelf-dev libdw-dev zlib1g-dev \
            autoconf automake libtool liblz4-dev uuid-dev libselinux1-dev libsepol-dev checkpolicy secilc default-jre-headless \
            gettext autopoint gperf texinfo kpartx e2fsprogs erofs-utils mtools xorriso pigz attr

          # 2. Install exact Mesa 26 host-tools dependencies (from gfx/build-mesa.sh + spirv-tools)
          sudo apt-get -o Acquire::Retries=5 install -y --fix-missing \
            llvm-18-dev libclang-18-dev libclc-18-dev libllvmspirvlib-18-dev clang-18 \
            spirv-tools spirv-headers glslang-tools glslang-dev \
            libdrm-dev libexpat1-dev zlib1g-dev

          # 3. Remove any pre-installed newer LLVM versions (19/20/21/22) on the runner so Meson picks LLVM 18.1 matching libllvmspirvlib-18-dev
          sudo rm -rf /usr/lib/llvm-19 /usr/lib/llvm-20 /usr/lib/llvm-21 /usr/lib/llvm-22 \
                      /usr/bin/llvm-config-19 /usr/bin/llvm-config-20 /usr/bin/llvm-config-21 /usr/bin/llvm-config-22 2>/dev/null || true
          sudo ln -sf /usr/bin/llvm-config-18 /usr/bin/llvm-config

          # 4. Verify SPIRV-Tools.pc and LLVMSPIRVLib.pc are visible to pkg-config immediately
          pkg-config --exists --print-errors SPIRV-Tools
          pkg-config --exists --print-errors LLVMSPIRVLib
          echo "[*] Verified SPIRV-Tools: $(pkg-config --modversion SPIRV-Tools), LLVMSPIRVLib: $(pkg-config --modversion LLVMSPIRVLib), llvm-config: $(llvm-config --version)"

      - name: Clone Project Churro & Pixelbook Go (ATLAS) Hardware Sources
        if: ${{ inputs.build_mode == 'full_build' }}
        run: |
          set -euo pipefail
          WORKDIR="$GITHUB_WORKSPACE/churro-build"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          git clone --depth 1 https://github.com/alesimula/project-churro.git
          git clone --depth 1 https://github.com/linuxkid473/gbos-x86.git
          git clone --depth 1 https://github.com/WeirdTreeThing/chromebook-linux-audio.git
          git clone --depth 1 https://github.com/WeirdTreeThing/alsa-ucm-conf-cros.git

          chmod +x "$WORKDIR/project-churro/churro.sh" \
                   "$WORKDIR/project-churro/tools/"*.sh \
                   "$WORKDIR/project-churro/gfx/"*.sh \
                   "$WORKDIR/project-churro/crypto/"*.sh \
                   "$WORKDIR/project-churro/kmod/"*.sh 2>/dev/null || true

          mkdir -p "$WORKDIR/deb-fw"
          cd "$WORKDIR/deb-fw"
          FW_DEB_URL="$(curl -fsSL https://packages.debian.org/sid/all/firmware-intel-sound/download | grep -m1 -oE 'https?://[^"]+/firmware-intel-sound_[^"]+_all\.deb' || true)"
          if [ -n "$FW_DEB_URL" ]; then
            curl -fL -o firmware-intel-sound.deb "$FW_DEB_URL" || true
            dpkg-deb -x firmware-intel-sound.deb "$WORKDIR/deb-fw/extracted" || true
            rm -f firmware-intel-sound.deb
          fi
          MISC_DEB_URL="$(curl -fsSL --connect-timeout 10 https://packages.debian.org/sid/all/firmware-intel-misc/download | grep -m1 -oE 'https?://[^"]+/firmware-intel-misc_[^"]+_all\.deb' || true)"
          if [ -n "$MISC_DEB_URL" ]; then
            curl -fL --connect-timeout 10 -o firmware-intel-misc.deb "$MISC_DEB_URL" || true
            dpkg-deb -x firmware-intel-misc.deb "$WORKDIR/deb-fw/extracted" || true
            rm -f firmware-intel-misc.deb
          fi

      - name: Stage Pixelbook Go (ATLAS) Audio, Webcam, Bluetooth, Sleep, Display & 160 DPI Fixes
        if: ${{ inputs.build_mode == 'full_build' }}
        run: |
          set -euo pipefail
          WORKDIR="$GITHUB_WORKSPACE/churro-build"
          cd "$WORKDIR/project-churro"

          # Ensure gfx/build-mesa.sh includes spirv-tools and uses LLVM 18 matching libllvmspirvlib-18-dev
          sed -i 's/libllvmspirvlib-18-dev/libllvmspirvlib-18-dev spirv-tools spirv-headers/' gfx/build-mesa.sh

          # 1. Append Pixelbook Go (ATLAS) UVC/IPU3 Webcam, Audio, EC Modules & GBOS KernelSU in kmod/profiles/generic.conf
          if [ -f "kmod/profiles/generic.conf" ]; then
            cat << 'KCFG_EOF' >> "kmod/profiles/generic.conf"
          Y+=" KPROBES KRETPROBES HAVE_SYSCALL_TRACEPOINTS KSU KSU_X86_PATCH_SYSCALL_DISPATCHER"
          M+=" USB_VIDEO_CLASS VIDEO_IMX208 INTEL_SKL_INT3472 IPU_BRIDGE VIDEO_IPU3_CIO2 VIDEO_IPU3_IMGU SND_SOC_INTEL_AVS SND_SOC_INTEL_AVS_MACH_DA7219 SND_SOC_INTEL_AVS_MACH_DMIC SND_SOC_INTEL_AVS_MACH_HDAUDIO SND_SOC_INTEL_AVS_MACH_MAX98373 SND_SOC_INTEL_AVS_MACH_MAX98927 SND_SOC_MAX98373 SND_SOC_MAX98373_I2C SND_SOC_DA7219 MFD_CROS_EC_DEV CROS_EC CROS_EC_LPC LEDS_CROS_EC"
          KCFG_EOF
            sed -i 's/^          //' "kmod/profiles/generic.conf" 2>/dev/null || true
          fi

          # 1b. Integrate KernelSU from gbos-x86 & wrap make in kmod/build-kernel.sh so KSU + protected_module_names_list are always built
          if [ -d "$WORKDIR/gbos-x86/kernel/kernelsu" ]; then
            cp -rf "$WORKDIR/gbos-x86/kernel/kernelsu" "$WORKDIR/project-churro/kmod/kernelsu"
          fi
          if [ -f "kmod/build-kernel.sh" ]; then
            python3 - "$WORKDIR/project-churro/kmod/kernelsu/apply.sh" << 'PY_KSU_HOOK'
          import sys
          apply_sh = sys.argv[1]
          p = "kmod/build-kernel.sh"
          lines = open(p).read().splitlines(keepends=True)
          wrapper = f'''
          make() {{
            for kdir in /var/cache/churro/src-*/common /var/cache/churro/src-* . ..; do
              if [ -d "$kdir" ]; then
                touch "$kdir/protected_module_names_list" "$kdir/../protected_module_names_list" 2>/dev/null || true
              fi
              if [ -d "$kdir/drivers" ] && [ -f "$kdir/Makefile" ] && [ -f "{apply_sh}" ]; then
                if [ ! -f "$kdir/drivers/kernelsu/Kconfig" ]; then
                  echo "[*] Applying GBOS KernelSU to kernel tree at $kdir..."
                  KSU_ABS="$(cd "$kdir" && pwd)"
                  mkdir -p /build
                  ln -sfn "$KSU_ABS" /build/src
                  bash "{apply_sh}" "$KSU_ABS" || true
                fi
                for odir in "$kdir"/out-* "$kdir"; do
                  if [ -f "$odir/.config" ]; then
                    touch "$odir/protected_module_names_list" "$odir/../protected_module_names_list" 2>/dev/null || true
                    if ! grep -q "^CONFIG_KSU=y" "$odir/.config"; then
                      if [ -x "$kdir/scripts/config" ]; then
                        "$kdir/scripts/config" --file "$odir/.config" -e KPROBES -e KRETPROBES -e HAVE_SYSCALL_TRACEPOINTS -e KSU -e KSU_X86_PATCH_SYSCALL_DISPATCHER || true
                      else
                        printf "\nCONFIG_KPROBES=y\nCONFIG_KRETPROBES=y\nCONFIG_HAVE_SYSCALL_TRACEPOINTS=y\nCONFIG_KSU=y\nCONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y\n" >> "$odir/.config"
                      fi
                    fi
                  fi
                done
              fi
            done
            command make "$@"
          }}
          '''
          lines.insert(1, wrapper + "\n")
          open(p, "w").write("".join(lines))
          PY_KSU_HOOK
          fi

          mkdir -p features/audio-generic/vendor/ksu
          if [ -f "$WORKDIR/gbos-x86/usb/ksu/ksud" ]; then
            cp -f "$WORKDIR/gbos-x86/usb/ksu/ksud" features/audio-generic/vendor/ksu/ksud
          fi
          if [ -f "$WORKDIR/gbos-x86/usb/ksu/manager.apk" ]; then
            cp -f "$WORKDIR/gbos-x86/usb/ksu/manager.apk" features/audio-generic/vendor/ksu/manager.apk
          fi
          if [ ! -s features/audio-generic/vendor/ksu/ksud ] || [ ! -s features/audio-generic/vendor/ksu/manager.apk ]; then
            python3 - "$WORKDIR/gbos-x86" << 'PY_KSU_DL'
          import json, os, re, sys, urllib.request
          gbos_dir = sys.argv[1]
          ksud_url = apk_url = ""
          bsh = os.path.join(gbos_dir, "build.sh")
          if os.path.exists(bsh):
              txt = open(bsh).read()
              m1 = re.search(r'https://github\.com/\S+?x86_64-linux-android-ksud', txt)
              m2 = re.search(r'https://github\.com/\S+?\.apk', txt)
              if m1: ksud_url = m1.group(0).strip("'\"")
              if m2: apk_url = m2.group(0).strip("'\"")
          if not ksud_url or not apk_url:
              req = urllib.request.Request("https://api.github.com/repos/tiann/KernelSU/releases/latest", headers={"User-Agent": "curl"})
              rel = json.loads(urllib.request.urlopen(req, timeout=15).read().decode())
              for a in rel.get("assets", []):
                  u = a.get("browser_download_url", "")
                  if "x86_64-linux-android-ksud" in u and not ksud_url:
                      ksud_url = u
                  elif u.endswith(".apk") and not apk_url:
                      apk_url = u
          if ksud_url and not os.path.exists("features/audio-generic/vendor/ksu/ksud"):
              urllib.request.urlretrieve(ksud_url, "features/audio-generic/vendor/ksu/ksud")
          if apk_url and not os.path.exists("features/audio-generic/vendor/ksu/manager.apk"):
              urllib.request.urlretrieve(apk_url, "features/audio-generic/vendor/ksu/manager.apk")
          PY_KSU_DL
          fi
          chmod 0755 features/audio-generic/vendor/ksu/ksud 2>/dev/null || true
          chmod 0644 features/audio-generic/vendor/ksu/manager.apk 2>/dev/null || true

          # 2. Stage Intel cAVS 1.5 Firmware & Topologies into features/firmware-extra/vendor/firmware/intel/avs
          FW_DEST="features/firmware-extra/vendor/firmware/intel/avs"
          mkdir -p "$FW_DEST/skl" "$FW_DEST/kbl"
          if [ -d "$WORKDIR/deb-fw/extracted/usr/lib/firmware/intel/avs" ]; then
            cp -rf "$WORKDIR/deb-fw/extracted/usr/lib/firmware/intel/avs/"* "$FW_DEST/" 2>/dev/null || true
          fi
          cp -f "$WORKDIR/deb-fw/extracted/usr/lib/firmware/intel/"*ipu3* "$WORKDIR/deb-fw/extracted/usr/lib/firmware/intel/"*irci* "features/firmware-extra/vendor/firmware/intel/" 2>/dev/null || true
          cp -rf "$WORKDIR/chromebook-linux-audio/blobs/avs/"* "$FW_DEST/" 2>/dev/null || true
          if [ -f "$FW_DEST/skl/dsp_basefw.bin" ] && [ ! -f "$FW_DEST/kbl/dsp_basefw.bin" ]; then
            cp -f "$FW_DEST/skl/dsp_basefw.bin" "$FW_DEST/kbl/dsp_basefw.bin"
          fi
          if [ -f "$FW_DEST/hda-80862809-tplg.bin" ] && [ ! -f "$FW_DEST/hda-8086280b-tplg.bin" ]; then
            cp -f "$FW_DEST/hda-80862809-tplg.bin" "$FW_DEST/hda-8086280b-tplg.bin"
          fi
          rm -rf "$WORKDIR/deb-fw" "$WORKDIR/chromebook-linux-audio" "$WORKDIR/alsa-ucm-conf-cros" "$WORKDIR/gbos-x86"

          # 3. Update features/audio-generic/patch-vendor_dlkm.sh to force dsp_driver=4 (AVS) and preload uvcvideo + AVS codecs
          cat << 'DLKM_EOF' >> features/audio-generic/patch-vendor_dlkm.sh
          grep -q 'dsp_driver=4' "$D/modules.options" 2>/dev/null || {
            echo "options snd_intel_dspcfg dsp_driver=4" >> "$D/modules.options"
            echo "options snd_soc_avs ignore_fw_version=1" >> "$D/modules.options"
          }
          grep -q 'softdep snd_soc_avs' "$D/modules.softdep" 2>/dev/null || {
            echo "softdep snd_soc_avs pre: uvcvideo videobuf2_vmalloc videobuf2_v4l2 videobuf2_common intel_skl_int3472_discrete ipu_bridge imx208 ipu3_cio2 ipu3_imgu snd_soc_dmic snd_soc_max98373 snd_soc_max98373_i2c snd_soc_da7219 snd_hda_codec_hdmi snd_soc_avs_dmic snd_soc_avs_max98373 snd_soc_avs_da7219 snd_soc_avs_hdaudio cros_ec_lpcs cros_ec_dev leds_cros_ec" >> "$D/modules.softdep"
            echo "softdep ipu3_cio2 pre: intel_skl_int3472_discrete ipu_bridge imx208" >> "$D/modules.softdep"
          }
          DLKM_EOF
          sed -i 's/^          //' features/audio-generic/patch-vendor_dlkm.sh

          # 4. Update features/audio-generic/get_variant_audio to recognize AVS / MAX98373 / DA7219 cards and unmute all cards
          python3 - << 'PY_GVA'
          import re
          p = "features/audio-generic/get_variant_audio"
          src = open(p).read()
          src = src.replace("case $id in sof*)", "case $id in sof*|avs*|MAX98373*|DA7219*)")
          src = re.sub(r'.*churro-mixer.*', 'for c in /sys/class/sound/card[0-9]*; do /vendor/bin/churro-mixer "${c##*card}" 2>/dev/null || true; done', src)
          open(p, "w").write(src)
          PY_GVA

          # 5. Update features/audio-generic/churro-mixer.c to unmute MAX98373 Speaker Switch & DA7219 Headphone Switch
          python3 - << 'PY_MIXER'
          import re
          p = "features/audio-generic/churro-mixer.c"
          src = open(p).read()
          new_sw = '''int sw = ((strstr(name, "Playback Switch") || strstr(name, "Speaker Switch") ||
                     strstr(name, "Spk") || strstr(name, "Headphone Switch") ||
                     strstr(name, "Sense") || strstr(name, "Enable Switch") ||
                     strstr(name, "DHT") || strstr(name, "BDE") ||
                     strstr(name, "DACL Switch") || strstr(name, "DACR Switch")) &&
                    !strstr(name, "Beep")) || !strcmp(name, "Capture Switch");'''
          new_vol = '''int vol = !strcmp(name, "Master Playback Volume") || !strcmp(name, "DSP") ||
                    strstr(name, "Left Speaker") || strstr(name, "Right Speaker") ||
                    strstr(name, "Digital Volume") || strstr(name, "Speaker Gain") ||
                    strstr(name, "Headphone Volume") || strstr(name, "Capture Volume");'''
          src = re.sub(r'int\s+sw\s*=[^;]+;', new_sw, src, count=1, flags=re.S)
          src = re.sub(r'int\s+vol\s*=[^;]+;', new_vol, src, count=1, flags=re.S)
          open(p, "w").write(src)
          PY_MIXER

          # 6. Update features/audio-generic/patch-vendor.sh for AVS PCM configs, SELinux labels, churro-kbd, and Blur toggle
          python3 - << 'PY_VENDOR'
          import re
          p = "features/audio-generic/patch-vendor.sh"
          src = open(p).read()

          avs_cards = '''mk sofhdadsp sof-hda-dsp 6 3 4 5
          mk avs_max98373 "avs_max98373" 0
          mk avsmax98373 "avs_max98373" 0
          mk MAX98373 "AVS I2S MAX98373" 0
          mk avsda7219 "avs_da7219" 0
          mk DA7219 "AVS I2S DA7219" 0'''
          src = re.sub(r'mk\s+sofhdadsp\s+sof-hda-dsp[^\n]*', avs_cards, src, count=1)

          footer_addon = '''
          # --- Pixelbook Go (ATLAS) Post-Processing (runs after Churro's own mk/SELinux loop) ---
          if [ -f "$T/lib64/iHD_drv_video.so" ] && [ ! -e "$T/lib64/i965_drv_video.so" ]; then
            ln -sfn iHD_drv_video.so "$T/lib64/i965_drv_video.so"
            setfattr -h -n security.selinux -v u:object_r:same_process_hal_file:s0 "$T/lib64/i965_drv_video.so" 2>/dev/null || true
          fi
          if [ -f "$T/build.prop" ]; then
            BP_CTX="$(getfattr -n security.selinux --only-values "$T/build.prop" 2>/dev/null || echo 'u:object_r:vendor_file:s0')"
            sed -i '/^ro\.surface_flinger\.supports_background_blur=/d; /^ro\.sf\.blurs_are_expensive=/d; /^ro\.launcher\.blur\.appLaunch=/d; /^persist\.sys\.sf\.disable_blurs=/d; /^persist\.bluetooth\.a2dp_offload\.disabled=/d' "$T/build.prop"
            echo "ro.surface_flinger.supports_background_blur=1" >> "$T/build.prop"
            echo "ro.sf.blurs_are_expensive=0" >> "$T/build.prop"
            echo "ro.launcher.blur.appLaunch=1" >> "$T/build.prop"
            echo "persist.sys.sf.disable_blurs=0" >> "$T/build.prop"
            echo "persist.bluetooth.a2dp_offload.disabled=false" >> "$T/build.prop"
            setfattr -n security.selinux -v "$BP_CTX" "$T/build.prop" 2>/dev/null || true
          fi

          # Route Speaker -> hw:sofrt5682,0 (card1 MAX98373), InternalMic -> hw:0,0 (card0 DMIC), Headphone/Mic -> hw:2,0 (card2 DA7219)
          python3 - "$A" << 'PY_FIX_XML'
          import glob, os, re, sys
          audio_root = sys.argv[1]
          for d in ["sof-rt5682_alc5682ivs_tas2563", "avs_max98373", "avsmax98373", "MAX98373", "avsda7219", "DA7219"]:
              cp = os.path.join(audio_root, d, "audio_config.xml")
              if not os.path.isfile(cp):
                  continue
              s = open(cp).read()
              s = re.sub(r'(<Speaker>\s*<PlaybackPCM>)[^<]+(</PlaybackPCM>)', lambda m: m.group(1) + "hw:sofrt5682,0" + m.group(2), s, flags=re.S)
              s = re.sub(r'(<InternalMic>\s*<CapturePCM>)[^<]+(</CapturePCM>)', lambda m: m.group(1) + "hw:0,0" + m.group(2), s, flags=re.S)
              s = re.sub(r'(<Headphone>\s*<PlaybackPCM>)[^<]+(</PlaybackPCM>)', lambda m: m.group(1) + "hw:2,0" + m.group(2), s, flags=re.S)
              s = re.sub(r'(<Mic>\s*<CapturePCM>)[^<]+(</CapturePCM>)', lambda m: m.group(1) + "hw:2,0" + m.group(2), s, flags=re.S)
              open(cp, "w").write(s)
          PY_FIX_XML

          # Ensure EVERY directory and file in /vendor/etc/audio, /vendor/etc/init, and /vendor/ksu has u:object_r:vendor_configs_file:s0
          find "$A" "$T/etc/init" "$T/ksu" -exec setfattr -h -n security.selinux -v u:object_r:vendor_configs_file:s0 {} \; 2>/dev/null || true

          if [ -f "$F/churro-kbd.c" ]; then
            gcc -O2 -static -o "$T/bin/churro-kbd" "$F/churro-kbd.c"
            chmod 0755 "$T/bin/churro-kbd"
            setfattr -n security.selinux -v u:object_r:get_variant_audio_exec:s0 "$T/bin/churro-kbd"
          fi
          if [ -f "$S/vendor_sepolicy.cil" ]; then
            cat << 'CIL_EOF' >> "$S/vendor_sepolicy.cil"
          (allow get_variant_audio input_device (dir (ioctl read getattr lock ope
