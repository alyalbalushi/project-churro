name: Build Project Churro for Pixelbook Go (ATLAS)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode (fast_patch = ~6 min using latest release; full_build = ~30 min from scratch)'
        required: true
        default: 'full_build'
        type: choice
        options:
          - 'fast_patch'
          - 'full_build'
      apply_latest_ota:
        description: 'Apply Latest Google OTA Delta Before Building'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '0'

permissions:
  contents: write

jobs:
  build-churro-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize Free Disk Space (~100 GB Free)
        run: |
          sudo swapoff -a || true
          sudo rm -rf /mnt/swapfile /swapfile \
                      /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/aws-cli /usr/local/share/chromium /usr/lib/jvm
          sudo docker system prune -a -f --volumes || true
          sudo apt-get clean
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install & Verify Project Churro, LLVM 18 & SPIRV-Tools Dependencies
        if: ${{ inputs.build_mode == 'full_build' }}
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf >/dev/null || true
          echo "nameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf >/dev/null || true
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt || true
          fi
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true

          sudo apt-get -o Acquire::Retries=5 -o Acquire::Check-Valid-Until=false update

          # 1. Install exact Project Churro host dependencies (from lib/deps.sh)
          sudo apt-get -o Acquire::Retries=5 install -y --fix-missing \
            gdisk dosfstools parted grub-common grub-efi-amd64-bin cpio attr kmod openssl \
            curl wget git unzip zip jq python3 python3-pip python3-venv python3-mako python3-yaml python3-ply \
            binutils lz4 zstd xz-utils bzip2 build-essential flex bison bc rsync pkg-config \
            cmake ninja-build meson libssl-dev libelf-dev libdw-dev zlib1g-dev \
            autoconf automake libtool liblz4-dev uuid-dev libselinux1-dev libsepol-dev checkpolicy secilc default-jre-headless \
            gettext autopoint gperf texinfo kpartx e2fsprogs erofs-utils mtools xorriso pigz attr

          # 2. Install exact Mesa 26 host-tools dependencies (from gfx/build-mesa.sh + spirv-tools)
          sudo apt-get -o Acquire::Retries=5 install -y --fix-missing \
            llvm-18-dev libclang-18-dev libclc-18-dev libllvmspirvlib-18-dev clang-18 \
            spirv-tools spirv-headers glslang-tools glslang-dev \
            libdrm-dev libexpat1-dev zlib1g-dev

          # 3. Remove any pre-installed newer LLVM versions (19/20/21/22) on the runner so Meson picks LLVM 18.1 matching libllvmspirvlib-18-dev
          sudo rm -rf /usr/lib/llvm-19 /usr/lib/llvm-20 /usr/lib/llvm-21 /usr/lib/llvm-22 \
                      /usr/bin/llvm-config-19 /usr/bin/llvm-config-20 /usr/bin/llvm-config-21 /usr/bin/llvm-config-22 2>/dev/null || true
          sudo ln -sf /usr/bin/llvm-config-18 /usr/bin/llvm-config

          # 4. Verify SPIRV-Tools.pc and LLVMSPIRVLib.pc are visible to pkg-config immediately
          pkg-config --exists --print-errors SPIRV-Tools
          pkg-config --exists --print-errors LLVMSPIRVLib
          echo "[*] Verified SPIRV-Tools: $(pkg-config --modversion SPIRV-Tools), LLVMSPIRVLib: $(pkg-config --modversion LLVMSPIRVLib), llvm-config: $(llvm-config --version)"

      - name: Clone Project Churro & Pixelbook Go (ATLAS) Hardware Sources
        if: ${{ inputs.build_mode == 'full_build' }}
        run: |
          set -euo pipefail
          WORKDIR="$GITHUB_WORKSPACE/churro-build"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          git clone --depth 1 https://github.com/alesimula/project-churro.git
          git clone --depth 1 https://github.com/linuxkid473/gbos-x86.git
          git clone --depth 1 https://github.com/WeirdTreeThing/chromebook-linux-audio.git
          git clone --depth 1 https://github.com/WeirdTreeThing/alsa-ucm-conf-cros.git

          chmod +x "$WORKDIR/project-churro/churro.sh" \
                   "$WORKDIR/project-churro/tools/"*.sh \
                   "$WORKDIR/project-churro/gfx/"*.sh \
                   "$WORKDIR/project-churro/crypto/"*.sh \
                   "$WORKDIR/project-churro/kmod/"*.sh 2>/dev/null || true

          mkdir -p "$WORKDIR/deb-fw"
          cd "$WORKDIR/deb-fw"
          FW_DEB_URL="$(curl -fsSL https://packages.debian.org/sid/all/firmware-intel-sound/download | grep -m1 -oE 'https?://[^"]+/firmware-intel-sound_[^"]+_all\.deb' || true)"
          if [ -n "$FW_DEB_URL" ]; then
            curl -fL -o firmware-intel-sound.deb "$FW_DEB_URL" || true
            dpkg-deb -x firmware-intel-sound.deb "$WORKDIR/deb-fw/extracted" || true
            rm -f firmware-intel-sound.deb
          fi
          MISC_DEB_URL="$(curl -fsSL --connect-timeout 10 https://packages.debian.org/sid/all/firmware-intel-misc/download | grep -m1 -oE 'https?://[^"]+/firmware-intel-misc_[^"]+_all\.deb' || true)"
          if [ -n "$MISC_DEB_URL" ]; then
            curl -fL --connect-timeout 10 -o firmware-intel-misc.deb "$MISC_DEB_URL" || true
            dpkg-deb -x firmware-intel-misc.deb "$WORKDIR/deb-fw/extracted" || true
            rm -f firmware-intel-misc.deb
          fi

      - name: Stage Pixelbook Go (ATLAS) Audio, Webcam, Bluetooth, Sleep, Display & 160 DPI Fixes
        if: ${{ inputs.build_mode == 'full_build' }}
        run: |
          set -euo pipefail
          WORKDIR="$GITHUB_WORKSPACE/churro-build"
          cd "$WORKDIR/project-churro"

          # Ensure gfx/build-mesa.sh includes spirv-tools and uses LLVM 18 matching libllvmspirvlib-18-dev
          sed -i 's/libllvmspirvlib-18-dev/libllvmspirvlib-18-dev spirv-tools spirv-headers/' gfx/build-mesa.sh

          # 1. Append Pixelbook Go (ATLAS) UVC/IPU3 Webcam, Audio, EC Modules & GBOS KernelSU in kmod/profiles/generic.conf
          if [ -f "kmod/profiles/generic.conf" ]; then
            cat << 'KCFG_EOF' >> "kmod/profiles/generic.conf"
          Y+=" KPROBES KRETPROBES HAVE_SYSCALL_TRACEPOINTS KSU KSU_X86_PATCH_SYSCALL_DISPATCHER"
          M+=" USB_VIDEO_CLASS VIDEO_IMX208 INTEL_SKL_INT3472 IPU_BRIDGE VIDEO_IPU3_CIO2 VIDEO_IPU3_IMGU SND_SOC_INTEL_AVS SND_SOC_INTEL_AVS_MACH_DA7219 SND_SOC_INTEL_AVS_MACH_DMIC SND_SOC_INTEL_AVS_MACH_HDAUDIO SND_SOC_INTEL_AVS_MACH_MAX98373 SND_SOC_INTEL_AVS_MACH_MAX98927 SND_SOC_MAX98373 SND_SOC_MAX98373_I2C SND_SOC_DA7219 MFD_CROS_EC_DEV CROS_EC CROS_EC_LPC LEDS_CROS_EC"
          KCFG_EOF
            sed -i 's/^          //' "kmod/profiles/generic.conf" 2>/dev/null || true
          fi

          # 1b. Integrate KernelSU from gbos-x86 (kernel/kernelsu/apply.sh + CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y + ksud + manager.apk)
          if [ -f "$WORKDIR/gbos-x86/kernel/kernelsu/apply.sh" ] && [ -f "kmod/build-kernel.sh" ]; then
            python3 - "$WORKDIR/gbos-x86/kernel/kernelsu/apply.sh" << 'PY_KSU_HOOK'
          import re, sys
          apply_sh = sys.argv[1]
          p = "kmod/build-kernel.sh"
          s = open(p).read()
          hook = f'''
          # --- Inject GBOS KernelSU into kernel tree before config/make ---
          for kdir in . "$SRC" "$KSRC" "$KERNEL_DIR" "$1"; do
            if [ -n "$kdir" ] && [ -d "$kdir/drivers" ] && [ -f "$kdir/Makefile" ] && [ ! -e "$kdir/drivers/kernelsu" ]; then
              echo "[*] Applying GBOS KernelSU to kernel tree at $kdir..."
              bash "{apply_sh}" "$kdir" || (cd "$kdir" && bash "{apply_sh}" .) || true
              for cfg in "$kdir/.config" "$OUT/.config" .config; do
                if [ -f "$cfg" ]; then
                  grep -q "CONFIG_KSU=y" "$cfg" || printf "\nCONFIG_KPROBES=y\nCONFIG_KSU=y\nCONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y\n" >> "$cfg"
                fi
              done
            fi
          done
          '''
          s = re.sub(r'(olddefconfig)', hook + r'\n\1', s, count=1)
          open(p, "w").write(s)
          PY_KSU_HOOK
          fi

          mkdir -p features/audio-generic/vendor/ksu
          if [ -f "$WORKDIR/gbos-x86/usb/ksu/ksud" ]; then
            cp -f "$WORKDIR/gbos-x86/usb/ksu/ksud" features/audio-generic/vendor/ksu/ksud
          fi
          if [ -f "$WORKDIR/gbos-x86/usb/ksu/manager.apk" ]; then
            cp -f "$WORKDIR/gbos-x86/usb/ksu/manager.apk" features/audio-generic/vendor/ksu/manager.apk
          fi
          if [ ! -s features/audio-generic/vendor/ksu/ksud ] || [ ! -s features/audio-generic/vendor/ksu/manager.apk ]; then
            python3 - "$WORKDIR/gbos-x86" << 'PY_KSU_DL'
          import json, os, re, sys, urllib.request
          gbos_dir = sys.argv[1]
          ksud_url = apk_url = ""
          bsh = os.path.join(gbos_dir, "build.sh")
          if os.path.exists(bsh):
              txt = open(bsh).read()
              m1 = re.search(r'https://github\.com/\S+?x86_64-linux-android-ksud', txt)
              m2 = re.search(r'https://github\.com/\S+?\.apk', txt)
              if m1: ksud_url = m1.group(0).strip("'\"")
              if m2: apk_url = m2.group(0).strip("'\"")
          if not ksud_url or not apk_url:
              req = urllib.request.Request("https://api.github.com/repos/tiann/KernelSU/releases/latest", headers={"User-Agent": "curl"})
              rel = json.loads(urllib.request.urlopen(req, timeout=15).read().decode())
              for a in rel.get("assets", []):
                  u = a.get("browser_download_url", "")
                  if "x86_64-linux-android-ksud" in u and not ksud_url:
                      ksud_url = u
                  elif u.endswith(".apk") and not apk_url:
                      apk_url = u
          if ksud_url and not os.path.exists("features/audio-generic/vendor/ksu/ksud"):
              urllib.request.urlretrieve(ksud_url, "features/audio-generic/vendor/ksu/ksud")
          if apk_url and not os.path.exists("features/audio-generic/vendor/ksu/manager.apk"):
              urllib.request.urlretrieve(apk_url, "features/audio-generic/vendor/ksu/manager.apk")
          PY_KSU_DL
          fi
          chmod 0755 features/audio-generic/vendor/ksu/ksud 2>/dev/null || true
          chmod 0644 features/audio-generic/vendor/ksu/manager.apk 2>/dev/null || true

          # 2. Stage Intel cAVS 1.5 Firmware & Topologies into features/firmware-extra/vendor/firmware/intel/avs
          FW_DEST="features/firmware-extra/vendor/firmware/intel/avs"
          mkdir -p "$FW_DEST/skl" "$FW_DEST/kbl"
          if [ -d "$WORKDIR/deb-fw/extracted/usr/lib/firmware/intel/avs" ]; then
            cp -rf "$WORKDIR/deb-fw/extracted/usr/lib/firmware/intel/avs/"* "$FW_DEST/" 2>/dev/null || true
          fi
          cp -f "$WORKDIR/deb-fw/extracted/usr/lib/firmware/intel/"*ipu3* "$WORKDIR/deb-fw/extracted/usr/lib/firmware/intel/"*irci* "features/firmware-extra/vendor/firmware/intel/" 2>/dev/null || true
          cp -rf "$WORKDIR/chromebook-linux-audio/blobs/avs/"* "$FW_DEST/" 2>/dev/null || true
          if [ -f "$FW_DEST/skl/dsp_basefw.bin" ] && [ ! -f "$FW_DEST/kbl/dsp_basefw.bin" ]; then
            cp -f "$FW_DEST/skl/dsp_basefw.bin" "$FW_DEST/kbl/dsp_basefw.bin"
          fi
          if [ -f "$FW_DEST/hda-80862809-tplg.bin" ] && [ ! -f "$FW_DEST/hda-8086280b-tplg.bin" ]; then
            cp -f "$FW_DEST/hda-80862809-tplg.bin" "$FW_DEST/hda-8086280b-tplg.bin"
          fi
          rm -rf "$WORKDIR/deb-fw" "$WORKDIR/chromebook-linux-audio" "$WORKDIR/alsa-ucm-conf-cros" "$WORKDIR/gbos-x86"

          # 3. Update features/audio-generic/patch-vendor_dlkm.sh to force dsp_driver=4 (AVS) and preload uvcvideo + AVS codecs
          cat << 'DLKM_EOF' >> features/audio-generic/patch-vendor_dlkm.sh
          grep -q 'dsp_driver=4' "$D/modules.options" 2>/dev/null || {
            echo "options snd_intel_dspcfg dsp_driver=4" >> "$D/modules.options"
            echo "options snd_soc_avs ignore_fw_version=1" >> "$D/modules.options"
          }
          grep -q 'softdep snd_soc_avs' "$D/modules.softdep" 2>/dev/null || {
            echo "softdep snd_soc_avs pre: uvcvideo videobuf2_vmalloc videobuf2_v4l2 videobuf2_common intel_skl_int3472_discrete ipu_bridge imx208 ipu3_cio2 ipu3_imgu snd_soc_dmic snd_soc_max98373 snd_soc_max98373_i2c snd_soc_da7219 snd_hda_codec_hdmi snd_soc_avs_dmic snd_soc_avs_max98373 snd_soc_avs_da7219 snd_soc_avs_hdaudio cros_ec_lpcs cros_ec_dev leds_cros_ec" >> "$D/modules.softdep"
            echo "softdep ipu3_cio2 pre: intel_skl_int3472_discrete ipu_bridge imx208" >> "$D/modules.softdep"
          }
          DLKM_EOF
          sed -i 's/^          //' features/audio-generic/patch-vendor_dlkm.sh

          # 4. Update features/audio-generic/get_variant_audio to recognize AVS / MAX98373 / DA7219 cards and unmute all cards
          python3 - << 'PY_GVA'
          import re
          p = "features/audio-generic/get_variant_audio"
          src = open(p).read()
          src = src.replace("case $id in sof*)", "case $id in sof*|avs*|MAX98373*|DA7219*)")
          src = re.sub(r'.*churro-mixer.*', 'for c in /sys/class/sound/card[0-9]*; do /vendor/bin/churro-mixer "${c##*card}" 2>/dev/null || true; done', src)
          open(p, "w").write(src)
          PY_GVA

          # 5. Update features/audio-generic/churro-mixer.c to unmute MAX98373 Speaker Switch & DA7219 Headphone Switch
          python3 - << 'PY_MIXER'
          import re
          p = "features/audio-generic/churro-mixer.c"
          src = open(p).read()
          new_sw = '''int sw = ((strstr(name, "Playback Switch") || strstr(name, "Speaker Switch") ||
                     strstr(name, "Spk") || strstr(name, "Headphone Switch") ||
                     strstr(name, "Sense") || strstr(name, "Enable Switch") ||
                     strstr(name, "DHT") || strstr(name, "BDE") ||
                     strstr(name, "DACL Switch") || strstr(name, "DACR Switch")) &&
                    !strstr(name, "Beep")) || !strcmp(name, "Capture Switch");'''
          new_vol = '''int vol = !strcmp(name, "Master Playback Volume") || !strcmp(name, "DSP") ||
                    strstr(name, "Left Speaker") || strstr(name, "Right Speaker") ||
                    strstr(name, "Digital Volume") || strstr(name, "Speaker Gain") ||
                    strstr(name, "Headphone Volume") || strstr(name, "Capture Volume");'''
          src = re.sub(r'int\s+sw\s*=[^;]+;', new_sw, src, count=1, flags=re.S)
          src = re.sub(r'int\s+vol\s*=[^;]+;', new_vol, src, count=1, flags=re.S)
          open(p, "w").write(src)
          PY_MIXER

          # 6. Update features/audio-generic/patch-vendor.sh for AVS PCM 1 configs, i965_drv_video.so camera VA-API symlink, and Blur toggle
          python3 - << 'PY_VENDOR'
          import re
          p = "features/audio-generic/patch-vendor.sh"
          src = open(p).read()
          extra_vendor = '''T=$1; A=$T/etc/audio; F=$(dirname "$0"); S=$T/etc/selinux
          if [ -f "$T/lib64/iHD_drv_video.so" ] && [ ! -e "$T/lib64/i965_drv_video.so" ]; then
            ln -sfn iHD_drv_video.so "$T/lib64/i965_drv_video.so"
            setfattr -h -n security.selinux -v u:object_r:same_process_hal_file:s0 "$T/lib64/i965_drv_video.so" 2>/dev/null || true
          fi
          if [ -f "$T/build.prop" ]; then
            sed -i '/^ro\\.surface_flinger\\.supports_background_blur=/d; /^ro\\.sf\\.blurs_are_expensive=/d; /^ro\\.launcher\\.blur\\.appLaunch=/d; /^persist\\.sys\\.sf\\.disable_blurs=/d; /^persist\\.bluetooth\\.a2dp_offload\\.disabled=/d' "$T/build.prop"
            echo "ro.surface_flinger.supports_background_blur=1" >> "$T/build.prop"
            echo "ro.sf.blurs_are_expensive=0" >> "$T/build.prop"
            echo "ro.launcher.blur.appLaunch=1" >> "$T/build.prop"
            echo "persist.sys.sf.disable_blurs=0" >> "$T/build.prop"
            echo "persist.bluetooth.a2dp_offload.disabled=false" >> "$T/build.prop"
          fi
          for ipa_dir in "$T/share/libcamera/ipa/ipu3" "$T/etc/libcamera/ipa/ipu3" "$T/etc/camera/libcamera"; do
            mkdir -p "$ipa_dir"
            cat << 'IMX_EOF' > "$ipa_dir/imx208.yaml"
          %YAML 1.1
          ---
          version: 1
          algorithms:
            - Agc:
            - Awb:
            - BlackLevelCorrection:
            - ToneMapping:
          ...
          IMX_EOF
            sed -i 's/^          //' "$ipa_dir/imx208.yaml"
            setfattr -n security.selinux -v u:object_r:vendor_configs_file:s0 "$ipa_dir/imx208.yaml" 2>/dev/null || true
          done'''
          src = src.replace('T=$1; A=$T/etc/audio; F=$(dirname "$0"); S=$T/etc/selinux', extra_vendor, 1)

          avs_cards = '''mk sofhdadsp sof-hda-dsp 6 3 4 5
          mk avsmax98373 "avs_max98373" 0
          mk MAX98373 "AVS I2S MAX98373" 0
          mk avsda7219 "avs_da7219" 0
          mk DA7219 "AVS I2S DA7219" 0
          for avs_d in avsmax98373 MAX98373 avsda7219 DA7219; do
            CFG="$A/$avs_d/audio_config.xml"
            if [ -f "$CFG" ]; then
              python3 - "$CFG" << 'PY_ACFG'
          import re, sys
          cp = sys.argv[1]
          s = open(cp).read()
          s = re.sub(r'(<InternalMic>.*?)<CapturePCM>[^<]+</CapturePCM>', r'\1<CapturePCM>hw:0,0</CapturePCM>', s, flags=re.S)
          s = re.sub(r'(<Headphone>.*?)<PlaybackPCM>[^<]+</PlaybackPCM>', r'\1<PlaybackPCM>hw:2,0</PlaybackPCM>', s, flags=re.S)
          s = re.sub(r'(<Mic>.*?)<CapturePCM>[^<]+</CapturePCM>', r'\1<CapturePCM>hw:2,0</CapturePCM>', s, flags=re.S)
          open(cp, "w").write(s)
          PY_ACFG
              setfattr -n security.selinux -v u:object_r:vendor_configs_file:s0 "$CFG" 2>/dev/null || true
            fi
          done'''
          src = re.sub(r'mk\s+sofhdadsp\s+sof-hda-dsp[^\n]*', avs_cards, src, count=1)

          kbd_addon = '''
          if [ -f "$F/churro-kbd.c" ]; then
            gcc -O2 -static -o "$T/bin/churro-kbd" "$F/churro-kbd.c"
            chmod 0755 "$T/bin/churro-kbd"
            setfattr -n security.selinux -v u:object_r:get_variant_audio_exec:s0 "$T/bin/churro-kbd"
          fi
          if [ -f "$S/vendor_sepolicy.cil" ]; then
            cp -f "$S/vendor_sepolicy.cil" "$S/vendor_sepolicy.cil.bak"
            cat << 'CIL_EOF' >> "$S/vendor_sepolicy.cil"
          (allow get_variant_audio input_device (dir (ioctl read getattr lock open watch watch_reads search)))
          (allow get_variant_audio input_device (chr_file (ioctl read getattr lock open watch watch_reads)))
          (allow get_variant_audio sysfs (file (ioctl read write getattr lock append map open watch watch_reads)))
          (allow get_variant_audio sysfs_leds (dir (ioctl read getattr lock open watch watch_reads search)))
          (allow get_variant_audio sysfs_leds (file (ioctl read write getattr lock append map open watch watch_reads)))
          (allow get_variant_audio sysfs_leds (lnk_file (ioctl read getattr lock map open watch watch_reads)))
          CIL_EOF
            if command -v secilc >/dev/null 2>&1 && [ -f "$T/../system/system/etc/selinux/plat_sepolicy.cil" ]; then
              secilc -m -M true -G -N -c 30 "$T/../system/system/etc/selinux/plat_sepolicy.cil" "$S/plat_pub_versioned.cil" "$S/vendor_sepolicy.cil" -o /dev/null -f /dev/null || cp -f "$S/vendor_sepolicy.cil.bak" "$S/vendor_sepolicy.cil"
            fi
            rm -f "$S/vendor_sepolicy.cil.bak"
          fi
          '''
          src = src + "\n" + kbd_addon
          open(p, "w").write(src)
          PY_VENDOR

          # 6b. Create features/audio-generic/churro-kbd.c (Alt + F6/F7 or Alt + BrightnessDown/Up Keyboard Backlight Daemon)
          cat << 'KBD_C' > features/audio-generic/churro-kbd.c
          #include <dirent.h>
          #include <fcntl.h>
          #include <linux/input.h>
          #include <poll.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          #define BACKLIGHT_PATH "/sys/class/leds/chromeos::kbd_backlight/brightness"
          #define MAX_PATH_LEN "/sys/class/leds/chromeos::kbd_backlight/max_brightness"

          static int read_int(const char *path, int def_val) {
              int fd = open(path, O_RDONLY);
              if (fd < 0) return def_val;
              char buf[32] = {0};
              if (read(fd, buf, sizeof(buf) - 1) <= 0) { close(fd); return def_val; }
              close(fd);
              return atoi(buf);
          }

          static void write_int(const char *path, int val) {
              int fd = open(path, O_WRONLY);
              if (fd < 0) return;
              char buf[32];
              int n = snprintf(buf, sizeof(buf), "%d\n", val);
              write(fd, buf, n);
              close(fd);
          }

          int main(void) {
              if (access(BACKLIGHT_PATH, F_OK) != 0) return 0;
              int max_b = read_int(MAX_PATH_LEN, 100);
              if (max_b <= 0) max_b = 100;
              int step = max_b / 5;
              if (step < 1) step = 1;

              struct pollfd pfds[32];
              int nfds = 0;
              DIR *d = opendir("/dev/input");
              if (!d) return 0;
              struct dirent *de;
              while ((de = readdir(d)) != NULL && nfds < 32) {
                  if (strncmp(de->d_name, "event", 5) == 0) {
                      char p[64];
                      snprintf(p, sizeof(p), "/dev/input/%s", de->d_name);
                      int fd = open(p, O_RDONLY | O_NONBLOCK);
                      if (fd >= 0) {
                          pfds[nfds].fd = fd;
                          pfds[nfds].events = POLLIN;
                          nfds++;
                      }
                  }
              }
              closedir(d);
              if (nfds == 0) return 0;

              int alt_down = 0;
              while (1) {
                  if (poll(pfds, nfds, -1) <= 0) continue;
                  for (int i = 0; i < nfds; i++) {
                      if (!(pfds[i].revents & POLLIN)) continue;
                      struct input_event ev;
                      while (read(pfds[i].fd, &ev, sizeof(ev)) == sizeof(ev)) {
                          if (ev.type != EV_KEY) continue;
                          if (ev.code == KEY_LEFTALT || ev.code == KEY_RIGHTALT) {
                              alt_down = (ev.value != 0);
                          } else if (alt_down && ev.value == 1) {
                              int cur = read_int(BACKLIGHT_PATH, 40);
                              if (ev.code == KEY_F6 || ev.code == KEY_BRIGHTNESSDOWN) {
                                  cur -= step;
                                  if (cur < 0) cur = 0;
                                  write_int(BACKLIGHT_PATH, cur);
                              } else if (ev.code == KEY_F7 || ev.code == KEY_BRIGHTNESSUP) {
                                  cur += step;
                                  if (cur > max_b) cur = max_b;
                                  write_int(BACKLIGHT_PATH, cur);
                              }
                          }
                      }
                  }
              }
              return 0;
          }
          KBD_C
          sed -i 's/^          //' features/audio-generic/churro-kbd.c

          # 7. Inject Pixelbook Go (ATLAS) Display Scaling (1920x1080 @ 160 DPI), Bluetooth A2DP Fix, Blur, Deep Sleep & ADB TCP
          mkdir -p features/audio-generic/vendor/etc/init
          cat << 'ATLAS_RC' > features/audio-generic/vendor/etc/init/init.churro.atlas.rc
          on early-init
              setprop ro.sf.lcd_density 160
              setprop persist.sys.dpi 160
              setprop persist.aicore.enabled false

          on post-fs-data
              mkdir /data/adb 0700 root root
              mkdir /data/adb/ksu 0700 root root
              mkdir /data/adb/ksu/bin 0700 root root
              copy /vendor/ksu/ksud /data/adb/ksud
              copy /vendor/ksu/ksud /data/adb/ksu/bin/ksud
              chmod 0755 /data/adb/ksud
              chmod 0755 /data/adb/ksu/bin/ksud
              chown root root /data/adb/ksud
              chown root root /data/adb/ksu/bin/ksud

          on property:sys.boot_completed=1
              setprop persist.bluetooth.a2dp_offload.disabled false
              setprop persist.sys.sf.disable_blurs 0
              setprop service.adb.tcp.port 5555
              setprop persist.adb.tcp.port 5555
              write /sys/power/mem_sleep deep
              chmod 0666 /sys/class/leds/chromeos::kbd_backlight/brightness
              write /sys/class/leds/chromeos::kbd_backlight/brightness 40
              exec u:r:get_variant_audio:s0 -- /vendor/bin/sh -c "/vendor/bin/churro-mixer 0; /vendor/bin/churro-mixer 1; /vendor/bin/churro-mixer 2"
              copy /vendor/ksu/manager.apk /data/local/tmp/ksu-manager.apk
              chmod 0644 /data/local/tmp/ksu-manager.apk
              exec - root root -- /system/bin/pm install -r /data/local/tmp/ksu-manager.apk
              start churro_kbd

          service churro_kbd /vendor/bin/churro-kbd
              class late_start
              user root
              group root input system
              disabled
              seclabel u:r:get_variant_audio:s0
          ATLAS_RC
          sed -i 's/^          //' features/audio-generic/vendor/etc/init/init.churro.atlas.rc

          # 8. Add AVS dsp_driver=4, S3 deep sleep, and i915 PSR/FBC black-screen fix to /churro/grub.cfg via lib/esp.sh
          python3 - << 'PY_ESP'
          import re
          p = "lib/esp.sh"
          s = open(p).read()
          extra = " snd_intel_dspcfg.dsp_driver=4 mem_sleep_default=deep i915.enable_psr=0 i915.enable_fbc=0"
          def add_args(m):
              line = m.group(0)
              return line if "mem_sleep_default=deep" in line else line + extra
          s_new = re.sub(r'^.*linux\s+.*kernel[^\n]*', add_args, s, flags=re.M)
          assert s_new != s, "Failed to patch kernel cmdline in lib/esp.sh"
          open(p, "w").write(s_new)
          PY_ESP

      - name: Download Official Googlebook Recovery Image & Build Project Churro
        if: ${{ inputs.build_mode == 'full_build' }}
        env:
          APPLY_LATEST_OTA: ${{ inputs.apply_latest_ota }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          export LLVM_CONFIG=/usr/bin/llvm-config-18
          WORKDIR="$GITHUB_WORKSPACE/churro-build"
          cd "$WORKDIR/project-churro"

          echo "[*] Querying Google production_recovery.json for official recovery image..."
          CATALOG_JSON="$(curl -fsSL https://dl.google.com/dl/edgedl/device/recovery/production_recovery.json || true)"
          REC_URL="$(echo "$CATALOG_JSON" | jq -r '.[] | select(.device=="ruby" or .model=="ruby" or (.url | contains("ruby"))) | .url' | head -n1 || true)"
          if [ -z "$REC_URL" ] || [ "$REC_URL" = "null" ]; then
            REC_URL="https://dl.google.com/device/recovery/ruby-user/16452207/recovery.zip"
          fi
          echo "[*] Downloading & streaming recovery.bin from: $REC_URL"
          curl -fL "$REC_URL" -o "$WORKDIR/recovery.zip"
          unzip -p "$WORKDIR/recovery.zip" > "$WORKDIR/recovery.bin"
          rm -f "$WORKDIR/recovery.zip"
          df -h

          CURRENT_BIN="$WORKDIR/recovery.bin"
          if [ "${APPLY_LATEST_OTA}" = "1" ] && [ -x "tools/updater/ota-check.sh" ]; then
            STEP=1
            while ./tools/updater/ota-check.sh "$CURRENT_BIN" 2>&1; do
              NEXT_BIN="$WORKDIR/recovery_ota_${STEP}.bin"
              echo "[*] Applying Google OTA update step ${STEP}..."
              ./tools/updater/ota-update.sh "$CURRENT_BIN" --bin "$NEXT_BIN" || break
              rm -f "$CURRENT_BIN"
              CURRENT_BIN="$NEXT_BIN"
              STEP=$((STEP + 1))
            done
          fi

          CHURRO_EXEC="$(find "$WORKDIR" -name churro.sh | head -n1)"
          echo "[*] Located churro.sh at: $CHURRO_EXEC"
          cd "$(dirname "$CHURRO_EXEC")"
          chmod +x "$CHURRO_EXEC"

          mkdir -p out
          yes "" | sudo -E "$CHURRO_EXEC" auto "$CURRENT_BIN" out/churro-pixelbook-go-atlas.img || \
            sudo -E "$CHURRO_EXEC" auto "$CURRENT_BIN" out/churro-pixelbook-go-atlas.img <<< ""
          rm -f "$CURRENT_BIN"
          sudo rm -rf /var/cache/churro 2>/dev/null || true
          df -h

          echo "[*] Compressing and chunking into 1900MB parts (GitHub 2 GB release asset limit)..."
          cd out
          pigz -p "$(nproc)" -c churro-pixelbook-go-atlas.img | split -b 1900M - churro-pixelbook-go-atlas.img.gz.part-
          rm -f churro-pixelbook-go-atlas.img

          cat << 'WIN_BAT' > REASSEMBLE.bat
          @echo off
          echo ==========================================================
          echo Reassembling churro-pixelbook-go-atlas.img.gz ...
          echo ==========================================================
          copy /b churro-pixelbook-go-atlas.img.gz.part-* churro-pixelbook-go-atlas.img.gz
          echo Done! You can now flash churro-pixelbook-go-atlas.img.gz with Rufus or balenaEtcher.
          pause
          WIN_BAT

          cat << 'SH_REASM' > reassemble.sh
          #!/bin/sh
          echo "Reassembling churro-pixelbook-go-atlas.img.gz..."
          cat churro-pixelbook-go-atlas.img.gz.part-* > churro-pixelbook-go-atlas.img.gz
          echo "Done! You can now flash churro-pixelbook-go-atlas.img.gz with balenaEtcher or dd."
          SH_REASM
          chmod +x reassemble.sh

          ls -lh churro-pixelbook-go-atlas.img.gz.part-*

      - name: Fast Patch Latest Release Image (~6 min)
        if: ${{ inputs.build_mode == 'fast_patch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pigz gdisk erofs-utils attr git gcc libc6-dev

          WORKDIR="$GITHUB_WORKSPACE/fast-patch"
          mkdir -p "$WORKDIR/dl" "$WORKDIR/out"
          cd "$WORKDIR"

          echo "[*] Downloading latest release parts from $GITHUB_REPOSITORY..."
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "churro-pixelbook-go-atlas.img.gz.part-*" -D "$WORKDIR/dl"

          echo "[*] Decompressing image with pigz..."
          cat "$WORKDIR/dl"/churro-pixelbook-go-atlas.img.gz.part-* | pigz -dc > "$WORKDIR/atlas.img"
          rm -rf "$WORKDIR/dl"

          # 1. Patch /churro/grub.cfg on EFI-SYSTEM
          EFI_INFO="$(sgdisk -p "$WORKDIR/atlas.img" | awk '$6=="EF00" || $7=="EFI-SYSTEM" {print $2, $3; exit}')"
          EFI_START="$(echo "$EFI_INFO" | awk '{print $1}')"
          mkdir -p "$WORKDIR/esp"
          sudo mount -o loop,offset=$((EFI_START * 512)) "$WORKDIR/atlas.img" "$WORKDIR/esp"
          sudo python3 - << 'PY_GRUB'
          import re
          p = "/home/runner/work"
          import glob
          cfgs = glob.glob("esp/churro/grub.cfg") + glob.glob("**/esp/churro/grub.cfg", recursive=True)
          cfg = cfgs[0]
          s = open(cfg).read()
          extra = " snd_intel_dspcfg.dsp_driver=4 mem_sleep_default=deep i915.enable_psr=0 i915.enable_fbc=0"
          def add_args(m):
              line = m.group(0)
              return line if "mem_sleep_default=deep" in line else line + extra
          s2 = re.sub(r'^\s*linux\s+.*churro/kernel[^\n]*', add_args, s, flags=re.M)
          open(cfg, "w").write(s2)
          print("[*] Patched grub.cfg")
          PY_GRUB
          sudo umount "$WORKDIR/esp"

          # 2. Extract vendor_a (either direct GPT partition or logical partition inside super)
          sgdisk -p "$WORKDIR/atlas.img"
          python3 - << 'PY_EXTRACT'
          import json, re, struct, subprocess
          img = "atlas.img"
          gpt = subprocess.check_output(["sgdisk", "-p", img], text=True)
          def find_part(name):
              for line in gpt.splitlines():
                  cols = line.split()
                  if cols and cols[0].isdigit() and cols[-1] == name:
                      return int(cols[1]), int(cols[2])
              return None

          extents = []
          v = find_part("vendor_a")
          if v:
              s, e = v
              extents = [(s * 512, (e - s + 1) * 512)]
              print(f"[*] Found direct GPT vendor_a: start={s}, sectors={e-s+1}")
          else:
              sup = find_part("super")
              assert sup, "Neither vendor_a nor super found in GPT!"
              sup_off = sup[0] * 512
              with open(img, "rb") as f:
                  f.seek(sup_off + 12288)
                  hdr = f.read(128)
                  magic, maj, minv, hdr_size = struct.unpack_from("<IHHI", hdr, 0)
                  assert magic == 0x414c5030, f"Bad liblp magic: {hex(magic)}"
                  p_off, p_num, p_sz = struct.unpack_from("<III", hdr, 80)
                  e_off, e_num, e_sz = struct.unpack_from("<III", hdr, 92)
                  tbl_base = sup_off + 12288 + hdr_size
                  f.seek(tbl_base + p_off)
                  parts_raw = f.read(p_num * p_sz)
                  f.seek(tbl_base + e_off)
                  exts_raw = f.read(e_num * e_sz)
                  target = None
                  for i in range(p_num):
                      name_b, attrs, first_e, num_e, grp = struct.unpack_from("<36sIIII", parts_raw, i * p_sz)
                      name = name_b.split(b"\x00", 1)[0].decode("utf-8", "ignore")
                      if name == "vendor_a":
                          target = (first_e, num_e)
                          break
                  assert target, "vendor_a not found inside super!"
                  for j in range(target[0], target[0] + target[1]):
                      n_sec, t_type, t_data, t_src = struct.unpack_from("<QIQI", exts_raw, j * e_sz)
                      assert t_type == 0, f"Non-linear extent type: {t_type}"
                      extents.append((sup_off + t_data * 512, n_sec * 512))
                  print(f"[*] Found vendor_a inside super ({len(extents)} extent(s), {sum(x[1] for x in extents)} bytes)")

          with open("vendor_extents.json", "w") as jf:
              json.dump(extents, jf)
          with open(img, "rb") as fin, open("vendor_a.img", "wb") as fout:
              for off, length in extents:
                  fin.seek(off)
                  rem = length
                  while rem > 0:
                      chunk = fin.read(min(rem, 16 * 1024 * 1024))
                      fout.write(chunk)
                      rem -= len(chunk)
          PY_EXTRACT

          if command -v extract.erofs >/dev/null 2>&1; then
            sudo extract.erofs -x -i "$WORKDIR/vendor_a.img" -o "$WORKDIR/vendor_dir"
          else
            sudo fsck.erofs --extract="$WORKDIR/vendor_dir" "$WORKDIR/vendor_a.img"
          fi
          rm -f "$WORKDIR/vendor_a.img"

          # 3. Clone project-churro for churro-mixer.c and recompile it statically
          git clone --depth 1 https://github.com/alesimula/project-churro.git "$WORKDIR/pc"
          python3 - << 'PY_MIX'
          import re
          p = "pc/features/audio-generic/churro-mixer.c"
          src = open(p).read()
          new_sw = '''int sw = ((strstr(name, "Playback Switch") || strstr(name, "Speaker Switch") ||
                     strstr(name, "Spk") || strstr(name, "Headphone Switch") ||
                     strstr(name, "Sense") || strstr(name, "Enable Switch") ||
                     strstr(name, "DHT") || strstr(name, "BDE") ||
                     strstr(name, "DACL Switch") || strstr(name, "DACR Switch")) &&
                    !strstr(name, "Beep")) || !strcmp(name, "Capture Switch");'''
          new_vol = '''int vol = !strcmp(name, "Master Playback Volume") || !strcmp(name, "DSP") ||
                    strstr(name, "Left Speaker") || strstr(name, "Right Speaker") ||
                    strstr(name, "Digital Volume") || strstr(name, "Speaker Gain") ||
                    strstr(name, "Headphone Volume") || strstr(name, "Capture Volume");'''
          src = re.sub(r'int\s+sw\s*=[^;]+;', new_sw, src, count=1, flags=re.S)
          src = re.sub(r'int\s+vol\s*=[^;]+;', new_vol, src, count=1, flags=re.S)
          open(p, "w").write(src)
          PY_MIX
          gcc -O2 -static -o "$WORKDIR/churro-mixer" "$WORKDIR/pc/features/audio-generic/churro-mixer.c"
          MIX_CTX="$(sudo getfattr -n security.selinux --only-values "$WORKDIR/vendor_dir/bin/churro-mixer" 2>/dev/null || echo 'u:object_r:vendor_file:s0')"
          sudo cp -f "$WORKDIR/churro-mixer" "$WORKDIR/vendor_dir/bin/churro-mixer"
          sudo chmod 0755 "$WORKDIR/vendor_dir/bin/churro-mixer"
          sudo setfattr -n security.selinux -v "$MIX_CTX" "$WORKDIR/vendor_dir/bin/churro-mixer" 2>/dev/null || true

          # 4. Fix audio_config.xml (hw:${W},0 + SELinux label)
          for avs_d in avsmax98373 MAX98373 avsda7219 DA7219; do
            CFG="$WORKDIR/vendor_dir/etc/audio/$avs_d/audio_config.xml"
            if sudo test -f "$CFG"; then
              sudo sed -i 's|<PlaybackPCM>hw:\(${W}\),1</PlaybackPCM>|<PlaybackPCM>hw:\1,0</PlaybackPCM>|g; s|<PlaybackPCM>hw:\([0-9]*\),1</PlaybackPCM>|<PlaybackPCM>hw:\1,0</PlaybackPCM>|g' "$CFG"
              sudo setfattr -n security.selinux -v u:object_r:vendor_configs_file:s0 "$CFG"
            fi
          done

          # 5. Update vendor/build.prop + init.churro.atlas.rc (remove SELinux-blocked churro-atlas-init.sh)
          sudo rm -f "$WORKDIR/vendor_dir/bin/churro-atlas-init.sh"
          BP="$WORKDIR/vendor_dir/build.prop"
          BP_CTX="$(sudo getfattr -n security.selinux --only-values "$BP" 2>/dev/null || echo 'u:object_r:vendor_file:s0')"
          sudo sed -i '/^persist\.bluetooth\.a2dp_offload\.disabled=/d' "$BP"
          echo "persist.bluetooth.a2dp_offload.disabled=false" | sudo tee -a "$BP" >/dev/null
          sudo setfattr -n security.selinux -v "$BP_CTX" "$BP" 2>/dev/null || true

          cat << 'ATLAS_RC' | sudo tee "$WORKDIR/vendor_dir/etc/init/init.churro.atlas.rc" >/dev/null
          on early-init
              setprop ro.sf.lcd_density 160
              setprop persist.sys.dpi 160
              setprop persist.aicore.enabled false

          on property:sys.boot_completed=1
              setprop persist.bluetooth.a2dp_offload.disabled false
              setprop persist.sys.sf.disable_blurs 0
              setprop service.adb.tcp.port 5555
              setprop persist.adb.tcp.port 5555
              write /sys/power/mem_sleep deep
              chmod 0666 /sys/class/leds/chromeos::kbd_backlight/brightness
              write /sys/class/leds/chromeos::kbd_backlight/brightness 40
              exec u:r:get_variant_audio:s0 -- /vendor/bin/sh -c "/vendor/bin/churro-mixer 0; /vendor/bin/churro-mixer 1; /vendor/bin/churro-mixer 2"
          ATLAS_RC
          sudo sed -i 's/^          //' "$WORKDIR/vendor_dir/etc/init/init.churro.atlas.rc"
          sudo chmod 0644 "$WORKDIR/vendor_dir/etc/init/init.churro.atlas.rc"
          sudo setfattr -n security.selinux -v u:object_r:vendor_configs_file:s0 "$WORKDIR/vendor_dir/etc/init/init.churro.atlas.rc"

          # 6. Repack vendor_a with mkfs.erofs (max lz4hc, falling back to lzma if needed to fit slot)
          MAX_BYTES=$(python3 -c 'import json; print(sum(x[1] for x in json.load(open("vendor_extents.json"))))')
          sudo mkfs.erofs -zlz4hc,12 -C 65536 "$WORKDIR/vendor_new.img" "$WORKDIR/vendor_dir"
          if [ "$(stat -c%s "$WORKDIR/vendor_new.img")" -gt "$MAX_BYTES" ]; then
            echo "[*] lz4hc,12 exceeded slot ($MAX_BYTES bytes); repacking with lzma..."
            sudo rm -f "$WORKDIR/vendor_new.img"
            sudo mkfs.erofs -zlzma "$WORKDIR/vendor_new.img" "$WORKDIR/vendor_dir"
          fi
          python3 - << 'PY_WRITE'
          import json, os
          extents = json.load(open("vendor_extents.json"))
          max_bytes = sum(x[1] for x in extents)
          new_bytes = os.path.getsize("vendor_new.img")
          print(f"[*] New vendor_a size: {new_bytes} bytes (max {max_bytes} bytes)")
          assert new_bytes <= max_bytes, f"vendor_new.img ({new_bytes}) exceeds slot ({max_bytes})!"
          with open("vendor_new.img", "rb") as fin, open("atlas.img", "r+b") as fout:
              for off, length in extents:
                  fout.seek(off)
                  data = fin.read(length)
                  if len(data) < length:
                      data += b"\x00" * (length - len(data))
                  fout.write(data)
          PY_WRITE
          sudo rm -rf "$WORKDIR/vendor_dir" "$WORKDIR/vendor_new.img" "$WORKDIR/pc" "$WORKDIR/churro-mixer"

          # 7. Compress with multi-core pigz and split for release upload
          mkdir -p "$GITHUB_WORKSPACE/churro-build/project-churro/out"
          cd "$GITHUB_WORKSPACE/churro-build/project-churro/out"
          pigz -p "$(nproc)" -c "$WORKDIR/atlas.img" | split -b 1900M - churro-pixelbook-go-atlas.img.gz.part-
          rm -f "$WORKDIR/atlas.img"
          ls -lh churro-pixelbook-go-atlas.img.gz.part-*

      - name: Upload Flashable Project Churro Image Parts to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: churro-atlas-${{ github.run_number }}
          name: "Project Churro for Pixelbook Go (ATLAS) — Build #${{ github.run_number }}"
          body: |
            ### Project Churro (Googlebook OS / Android 17) — Google Pixelbook Go (`ATLAS`)
            - **Graphics**: Native Mesa Intel Drivers (`iris` / `crocus` / `intel_hasvk` / `Zink`) + Rebuilt `minigbm` Allocator for Intel UHD Graphics 615 (Gen 9.5) + `i965_drv_video.so` VA-API symlink + SurfaceFlinger Blur
            - **CPU & Crypto**: Recompiled BoringSSL (`libcrypto.so` + `libcrypto_httpengine.so`) for Amber Lake / Haswell+ CPUs + Kernel `vex-emulate` handler
            - **Display & Sleep**: Pre-configured `1920x1080` at `160 DPI`, S3 `deep` sleep (`mem_sleep_default=deep`), and `i915.enable_psr=0 i915.enable_fbc=0` black-screen fix in `/churro/grub.cfg`
            - **Audio, Webcam & Bluetooth**: Intel cAVS 1.5 DSP (`SND_SOC_INTEL_AVS`, `dsp_driver=4`) + `MAX98373` speakers + `DA7219` headphone jack (`PCM 1`) + `uvcvideo` Duo Cam webcam + Bluetooth A2DP audio enabled
          files: |
            churro-build/project-churro/out/churro-pixelbook-go-atlas.img.gz.part-*
            churro-build/project-churro/out/REASSEMBLE.bat
            churro-build/project-churro/out/reassemble.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
