name: Build Project Churro for Pixelbook Go (ATLAS)
on:
  workflow_dispatch:
    inputs:
      apply_latest_ota:
        description: 'Apply Latest Google OTA Delta'
        required: true
        default: '1'
        type: choice
        options: ['1', '0']
permissions:
  contents: write
jobs:
  build-churro-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize Free Disk Space
        run: |
          sudo swapoff -a || true
          sudo rm -rf /mnt/swapfile /swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache /usr/local/aws-cli /usr/local/share/chromium /usr/lib/jvm
          sudo docker system prune -a -f --volumes || true
          sudo apt-get clean && df -h
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf >/dev/null || true
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=5 -o Acquire::Check-Valid-Until=false update
          sudo apt-get -o Acquire::Retries=5 install -y --fix-missing gdisk dosfstools parted grub-common grub-efi-amd64-bin cpio attr kmod openssl curl wget git unzip zip jq python3 python3-pip python3-venv python3-mako python3-yaml python3-ply binutils lz4 zstd xz-utils bzip2 build-essential flex bison bc rsync pkg-config cmake ninja-build meson libssl-dev libelf-dev libdw-dev zlib1g-dev autoconf automake libtool liblz4-dev uuid-dev libselinux1-dev libsepol-dev checkpolicy secilc default-jre-headless gettext autopoint gperf texinfo kpartx e2fsprogs erofs-utils mtools xorriso pigz llvm-18-dev libclang-18-dev libclc-18-dev libllvmspirvlib-18-dev clang-18 spirv-tools spirv-headers glslang-tools glslang-dev libdrm-dev libexpat1-dev
          sudo rm -rf /usr/lib/llvm-19 /usr/lib/llvm-20 /usr/lib/llvm-21 /usr/lib/llvm-22 /usr/bin/llvm-config-19 /usr/bin/llvm-config-20 /usr/bin/llvm-config-21 /usr/bin/llvm-config-22 2>/dev/null || true
          sudo ln -sf /usr/bin/llvm-config-18 /usr/bin/llvm-config
          pkg-config --exists --print-errors SPIRV-Tools LLVMSPIRVLib
      - name: Clone Sources
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE/cb"
          mkdir -p "$W/deb-fw" && cd "$W"
          for r in alesimula/project-churro linuxkid473/gbos-x86 WeirdTreeThing/chromebook-linux-audio WeirdTreeThing/alsa-ucm-conf-cros; do git clone --depth 1 "https://github.com/$r.git"; done
          git clone https://github.com/tiann/KernelSU.git "$W/KernelSU"
          sudo mkdir -p /build/inputs && sudo ln -sfn "$W/KernelSU" /build/inputs/KernelSU
          chmod +x "$W/project-churro/churro.sh" "$W/project-churro/"*/*.sh 2>/dev/null || true
          cd "$W/deb-fw"
          for p in firmware-intel-sound firmware-intel-misc; do
            U="$(curl -fsSL --connect-timeout 10 "https://packages.debian.org/sid/all/$p/download" | grep -m1 -oE "https?://[^\"]+/${p}_[^\"]+_all\.deb" || true)"
            [ -n "$U" ] && curl -fL --connect-timeout 10 -o "$p.deb" "$U" && dpkg-deb -x "$p.deb" extracted && rm -f "$p.deb" || true
          done
      - name: Stage Pixelbook Go Fixes & KernelSU
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE/cb"
          cd "$W/project-churro"
          FAG="features/audio-generic"
          sed -i 's/libllvmspirvlib-18-dev/libllvmspirvlib-18-dev spirv-tools spirv-headers/' gfx/build-mesa.sh
          printf 'Y+=" KPROBES KRETPROBES HAVE_SYSCALL_TRACEPOINTS OVERLAY_FS KSU KSU_X86_PATCH_SYSCALL_DISPATCHER"\nM+=" USB_VIDEO_CLASS VIDEO_IMX208 INTEL_SKL_INT3472 IPU_BRIDGE VIDEO_IPU3_CIO2 VIDEO_IPU3_IMGU SND_SOC_INTEL_AVS SND_SOC_INTEL_AVS_MACH_DA7219 SND_SOC_INTEL_AVS_MACH_DMIC SND_SOC_INTEL_AVS_MACH_HDAUDIO SND_SOC_INTEL_AVS_MACH_MAX98373 SND_SOC_INTEL_AVS_MACH_MAX98927 SND_SOC_MAX98373 SND_SOC_MAX98373_I2C SND_SOC_DA7219 MFD_CROS_EC_DEV CROS_EC CROS_EC_LPC LEDS_CROS_EC"\n' >> kmod/profiles/generic.conf
          cp -rf "$W/gbos-x86/kernel/kernelsu" "$W/project-churro/kmod/kernelsu"
          head -n 1 kmod/build-kernel.sh > kmod/bk.new
          cat << KW >> kmod/bk.new
          make() {
            ODIR=""
            for a in "\$@"; do case "\$a" in O=*) ODIR="\${a#O=}" ;; esac; done
            SRC=""
            for d in /var/cache/churro/src-*/common /var/cache/churro/src-* . ..; do
              [ -d "\$d" ] && touch "\$d/protected_module_names_list" "\$d/../protected_module_names_list" 2>/dev/null || true
              if [ -d "\$d/drivers" ] && [ -f "\$d/Makefile" ]; then
                SRC="\$(cd "\$d" && pwd)"
                if [ ! -f "\$SRC/drivers/kernelsu/Kconfig" ] && [ -f "$W/project-churro/kmod/kernelsu/apply.sh" ]; then
                  mkdir -p /build/inputs && ln -sfn "\$SRC" /build/src && ln -sfn "$W/KernelSU" /build/inputs/KernelSU
                  bash "$W/project-churro/kmod/kernelsu/apply.sh" "\$SRC"
                fi
                break
              fi
            done
            for cf in "\$PWD/.config" "\$ODIR/.config" \$(find /var/cache/churro -maxdepth 4 -name .config 2>/dev/null); do
              [ -f "\$cf" ] || continue
              o="\$(dirname "\$cf")"
              touch "\$o/protected_module_names_list" "\$o/../protected_module_names_list" 2>/dev/null || true
              if [ -n "\$SRC" ] && [ -f "\$SRC/drivers/kernelsu/Kconfig" ] && ! grep -q "^CONFIG_KSU=y" "\$cf"; then
                if [ -x "\$SRC/scripts/config" ]; then
                  "\$SRC/scripts/config" --file "\$cf" -e KPROBES -e KRETPROBES -e HAVE_SYSCALL_TRACEPOINTS -e OVERLAY_FS -e KSU -e KSU_X86_PATCH_SYSCALL_DISPATCHER
                else
                  printf "\nCONFIG_KPROBES=y\nCONFIG_KRETPROBES=y\nCONFIG_HAVE_SYSCALL_TRACEPOINTS=y\nCONFIG_OVERLAY_FS=y\nCONFIG_KSU=y\nCONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y\n" >> "\$cf"
                fi
                echo ">> KernelSU config enabled in \$cf"
              fi
            done
            command make "\$@"
            case " \$* " in *" bzImage "*|*" vmlinux "*|*" all "*)
              if ! grep -rq "^CONFIG_KSU=y" "\$PWD/.config" "\$ODIR/.config" /var/cache/churro/*/.config /var/cache/churro/*/*/.config 2>/dev/null; then
                echo "FATAL: CONFIG_KSU=y missing after kernel build!" >&2
                exit 1
              fi
            ;; esac
          }
          KW
          tail -n +2 kmod/build-kernel.sh >> kmod/bk.new && mv -f kmod/bk.new kmod/build-kernel.sh && chmod +x kmod/build-kernel.sh
          mkdir -p "$FAG/vendor/ksu" "$FAG/vendor/etc/init"
          cp -f "$W/gbos-x86/usb/ksu/"* "$FAG/vendor/ksu/" 2>/dev/null || true
          python3 - "$W/gbos-x86" << 'PKD'
          import json, os, re, sys, urllib.request
          kp, ap = "features/audio-generic/vendor/ksu/ksud", "features/audio-generic/vendor/ksu/manager.apk"
          if os.path.exists(kp) and os.path.exists(ap): sys.exit(0)
          ku = au = ""
          b = os.path.join(sys.argv[1], "build.sh")
          if os.path.exists(b):
              t = open(b).read()
              m1, m2 = re.search(r'https://github\.com/\S+?x86_64-linux-android-ksud', t), re.search(r'https://github\.com/\S+?\.apk', t)
              if m1: ku = m1.group(0).strip("'\"")
              if m2: au = m2.group(0).strip("'\"")
          if not ku or not au:
              req = urllib.request.Request("https://api.github.com/repos/tiann/KernelSU/releases/latest", headers={"User-Agent": "curl"})
              for a in json.loads(urllib.request.urlopen(req, timeout=15).read().decode()).get("assets", []):
                  u = a.get("browser_download_url", "")
                  if "x86_64-linux-android-ksud" in u and not ku: ku = u
                  elif u.endswith(".apk") and not au: au = u
          if ku and not os.path.exists(kp): urllib.request.urlretrieve(ku, kp)
          if au and not os.path.exists(ap): urllib.request.urlretrieve(au, ap)
          PKD
          chmod 0755 "$FAG/vendor/ksu/ksud" 2>/dev/null || true && chmod 0644 "$FAG/vendor/ksu/manager.apk" 2>/dev/null || true
          FW="features/firmware-extra/vendor/firmware/intel/avs"
          mkdir -p "$FW/skl" "$FW/kbl"
          cp -rf "$W/deb-fw/extracted/usr/lib/firmware/intel/avs/"* "$W/chromebook-linux-audio/blobs/avs/"* "$FW/" 2>/dev/null || true
          cp -f "$W/deb-fw/extracted/usr/lib/firmware/intel/"*ipu3* "$W/deb-fw/extracted/usr/lib/firmware/intel/"*irci* "features/firmware-extra/vendor/firmware/intel/" 2>/dev/null || true
          [ -f "$FW/skl/dsp_basefw.bin" ] && [ ! -f "$FW/kbl/dsp_basefw.bin" ] && cp -f "$FW/skl/dsp_basefw.bin" "$FW/kbl/dsp_basefw.bin" || true
          [ -f "$FW/hda-80862809-tplg.bin" ] && [ ! -f "$FW/hda-8086280b-tplg.bin" ] && cp -f "$FW/hda-80862809-tplg.bin" "$FW/hda-8086280b-tplg.bin" || true
          rm -rf "$W/deb-fw" "$W/chromebook-linux-audio" "$W/alsa-ucm-conf-cros" "$W/gbos-x86"
          printf 'echo "options snd_intel_dspcfg dsp_driver=4" >> "$D/modules.options"\necho "options snd_soc_avs ignore_fw_version=1" >> "$D/modules.options"\necho "softdep snd_soc_avs pre: uvcvideo videobuf2_vmalloc videobuf2_v4l2 videobuf2_common intel_skl_int3472_discrete ipu_bridge imx208 ipu3_cio2 ipu3_imgu snd_soc_dmic snd_soc_max98373 snd_soc_max98373_i2c snd_soc_da7219 snd_hda_codec_hdmi snd_soc_avs_dmic snd_soc_avs_max98373 snd_soc_avs_da7219 snd_soc_avs_hdaudio cros_ec_lpcs cros_ec_dev leds_cros_ec" >> "$D/modules.softdep"\necho "softdep ipu3_cio2 pre: intel_skl_int3472_discrete ipu_bridge imx208" >> "$D/modules.softdep"\n' >> "$FAG/patch-vendor_dlkm.sh"
          cat << 'KBD_C' > "$FAG/churro-kbd.c"
          #include <dirent.h>
          #include <fcntl.h>
          #include <linux/input.h>
          #include <poll.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #define B "/sys/class/leds/chromeos::kbd_backlight/brightness"
          #define M "/sys/class/leds/chromeos::kbd_backlight/max_brightness"
          static int ri(const char *p,int d){int f=open(p,0);if(f<0)return d;char b[32]={0};int n=read(f,b,31);close(f);return n>0?atoi(b):d;}
          static void wi(const char *p,int v){int f=open(p,1);if(f<0)return;char b[32];write(f,b,snprintf(b,32,"%d\n",v));close(f);}
          int main(void){
          if(access(B,0))return 0;
          int mx=ri(M,100);if(mx<=0)mx=100;int st=mx/5>0?mx/5:1,n=0,md=0;struct pollfd P[32];DIR *d=opendir("/dev/input");if(!d)return 0;struct dirent *e;
          while((e=readdir(d))&&n<32)if(!strncmp(e->d_name,"event",5)){char p[64];snprintf(p,64,"/dev/input/%s",e->d_name);int f=open(p,O_RDONLY|O_NONBLOCK);if(f>=0){P[n].fd=f;P[n++].events=POLLIN;}}
          closedir(d);
          while(n>0){if(poll(P,n,-1)<=0)continue;for(int i=0;i<n;i++){if(P[i].fd<0)continue;if(P[i].revents&(POLLERR|POLLHUP|POLLNVAL)){close(P[i].fd);P[i].fd=-1;continue;}if(!(P[i].revents&POLLIN))continue;struct input_event v;while(read(P[i].fd,&v,sizeof(v))==sizeof(v))if(v.type==EV_KEY){if(v.code==KEY_LEFTALT||v.code==KEY_RIGHTALT||v.code==KEY_LEFTMETA||v.code==KEY_RIGHTMETA)md=(v.value!=0);else if(v.value==1||v.value==2){int c=ri(B,40);if(v.code==KEY_KBDILLUMDOWN||(md&&(v.code==KEY_F6||v.code==KEY_BRIGHTNESSDOWN)))wi(B,c-st<0?0:c-st);else if(v.code==KEY_KBDILLUMUP||(md&&(v.code==KEY_F7||v.code==KEY_BRIGHTNESSUP)))wi(B,c+st>mx?mx:c+st);}}}}
          return 0;}
          KBD_C
          python3 - << 'PP'
          import re
          p = "features/audio-generic/get_variant_audio"
          s = open(p).read().replace("case $id in sof*)", "case $id in sof*|avs*|MAX98373*|DA7219*)")
          s = re.sub(r'.*churro-mixer.*', 'for c in /sys/class/sound/card[0-9]*; do /vendor/bin/churro-mixer "${c##*card}" 2>/dev/null || true; done', s)
          open(p, "w").write(s)
          p = "features/audio-generic/churro-mixer.c"
          s = open(p).read()
          sw = 'int sw = ((strstr(name, "Playback Switch") || strstr(name, "Speaker Switch") || strstr(name, "Spk") || strstr(name, "Headphone Switch") || strstr(name, "Sense") || strstr(name, "Enable Switch") || strstr(name, "DHT") || strstr(name, "BDE") || strstr(name, "DACL Switch") || strstr(name, "DACR Switch") || strstr(name, "Capture Switch") || strstr(name, "DMIC")) && !strstr(name, "Beep"));'
          vol = 'int vol = !strcmp(name, "Master Playback Volume") || !strcmp(name, "DSP") || strstr(name, "Left Speaker") || strstr(name, "Right Speaker") || strstr(name, "Digital Volume") || strstr(name, "Speaker Gain") || strstr(name, "Headphone Volume") || strstr(name, "Capture Volume") || strstr(name, "Mic Volume") || strstr(name, "DMIC");'
          s = re.sub(r'int\s+sw\s*=[^;]+;', sw, s, count=1, flags=re.S)
          s = re.sub(r'int\s+vol\s*=[^;]+;', vol, s, count=1, flags=re.S)
          open(p, "w").write(s)
          p = "features/audio-generic/patch-vendor.sh"
          s = open(p).read()
          extra_mk = [l for l in ['mk avsmax98373 "avs_max98373" 0', 'mk MAX98373 "AVS I2S MAX98373" 0', 'mk avsda7219 "avs_da7219" 0', 'mk DA7219 "AVS I2S DA7219" 0'] if f"mk {l.split()[1]} " not in s]
          if extra_mk: s = re.sub(r'(mk\s+sofhdadsp\s+sof-hda-dsp[^\n]*)', lambda m: m.group(1) + "\n" + "\n".join(extra_mk), s, count=1)
          open(p, "w").write(s)
          p = "lib/esp.sh"
          s = open(p).read()
          extra = " snd_intel_dspcfg.dsp_driver=4 mem_sleep_default=deep i915.enable_psr=0 i915.enable_fbc=0"
          s = re.sub(r'^.*linux\s+.*kernel[^\n]*', lambda m: m.group(0) if "mem_sleep_default=deep" in m.group(0) else m.group(0) + extra, s, flags=re.M)
          open(p, "w").write(s)
          PP
          cat << 'VE' >> "$FAG/patch-vendor.sh"
          if [ -f "$T/lib64/iHD_drv_video.so" ] && [ ! -e "$T/lib64/i965_drv_video.so" ]; then
            ln -sfn iHD_drv_video.so "$T/lib64/i965_drv_video.so" && setfattr -h -n security.selinux -v u:object_r:same_process_hal_file:s0 "$T/lib64/i965_drv_video.so" 2>/dev/null || true
          fi
          if [ -f "$T/build.prop" ]; then
            BP_CTX="$(getfattr -n security.selinux --only-values "$T/build.prop" 2>/dev/null || echo 'u:object_r:vendor_file:s0')"
            sed -i '/^ro\.surface_flinger\.supports_background_blur=/d; /^ro\.sf\.blurs_are_expensive=/d; /^ro\.launcher\.blur\.appLaunch=/d; /^persist\.sys\.sf\.disable_blurs=/d; /^persist\.bluetooth\.a2dp_offload\.disabled=/d' "$T/build.prop"
            printf "ro.surface_flinger.supports_background_blur=1\nro.sf.blurs_are_expensive=0\nro.launcher.blur.appLaunch=1\npersist.sys.sf.disable_blurs=0\npersist.bluetooth.a2dp_offload.disabled=false\n" >> "$T/build.prop"
            setfattr -n security.selinux -v "$BP_CTX" "$T/build.prop" 2>/dev/null || true
          fi
          cat << 'ATLAS_XML' > /tmp/atlas_audio_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <audio_config>
                  <SoundCardName>hw:1</SoundCardName>
                  <HiFi>
                          <Speaker>
                                  <PlaybackPCM>hw:1,1</PlaybackPCM>
                                  <DSPLatency>0</DSPLatency>
                          </Speaker>
                          <InternalMic>
                                  <CapturePCM>hw:0,2</CapturePCM>
                                  <CaptureChannelMap>
                                          <FL>0</FL>
                                          <FR>1</FR>
                                  </CaptureChannelMap>
                                  <IntrinsicSensitivity>-2600</IntrinsicSensitivity>
                                  <DSPLatency>0</DSPLatency>
                          </InternalMic>
                          <Headphone>
                                  <PlaybackPCM>hw:2,1</PlaybackPCM>
                                  <JackDev>avs_da7219 Headphone</JackDev>
                                  <JackSwitch>2</JackSwitch>
                                  <DSPLatency>0</DSPLatency>
                          </Headphone>
                          <Mic>
                                  <CapturePCM>hw:2,1</CapturePCM>
                                  <JackDev>avs_da7219 Mic</JackDev>
                                  <DSPLatency>0</DSPLatency>
                          </Mic>
                          <HDMI1>
                                  <PlaybackPCM>hw:3,1</PlaybackPCM>
                                  <JackDev>hdaudioB0D2 HDMI/DP,pcm=1</JackDev>
                                  <PlaybackChannels>2</PlaybackChannels>
                          </HDMI1>
                          <HDMI2>
                                  <PlaybackPCM>hw:3,2</PlaybackPCM>
                                  <JackDev>hdaudioB0D2 HDMI/DP,pcm=2</JackDev>
                                  <PlaybackChannels>2</PlaybackChannels>
                          </HDMI2>
                          <HDMI3>
                                  <PlaybackPCM>hw:3,3</PlaybackPCM>
                                  <JackDev>hdaudioB0D2 HDMI/DP,pcm=3</JackDev>
                                  <PlaybackChannels>2</PlaybackChannels>
                          </HDMI3>
                  </HiFi>
          </audio_config>
          ATLAS_XML
          for d in "$A"/sof-rt5682* "$A"/avs* "$A"/MAX98373* "$A"/DA7219*; do
            [ -d "$d" ] && cp -f /tmp/atlas_audio_config.xml "$d/audio_config.xml"
          done
          rm -f /tmp/atlas_audio_config.xml
          find "$A" "$T/etc/init" "$T/ksu" -exec setfattr -h -n security.selinux -v u:object_r:vendor_configs_file:s0 {} \; 2>/dev/null || true
          [ -f "$T/bin/churro-mixer" ] && setfattr -n security.selinux -v u:object_r:get_variant_audio_exec:s0 "$T/bin/churro-mixer" 2>/dev/null || true
          if [ -f "$F/churro-kbd.c" ]; then
            gcc -O2 -static -o "$T/bin/churro-kbd" "$F/churro-kbd.c" && chmod 0755 "$T/bin/churro-kbd" && setfattr -n security.selinux -v u:object_r:get_variant_audio_exec:s0 "$T/bin/churro-kbd" 2>/dev/null || true
          fi
          if [ -f "$S/vendor_sepolicy.cil" ]; then
            for t in sysfs sysfs_leds; do
              printf "(allow get_variant_audio %s (dir (ioctl read getattr lock open watch watch_reads search)))\n(allow get_variant_audio %s (file (ioctl read write getattr lock append map open watch watch_reads)))\n(allow get_variant_audio %s (lnk_file (ioctl read getattr lock map open watch watch_reads)))\n" "$t" "$t" "$t" >> "$S/vendor_sepolicy.cil"
            done
            printf "(allow get_variant_audio input_device (dir (ioctl read getattr lock open watch watch_reads search)))\n(allow get_variant_audio input_device (chr_file (ioctl read getattr lock open watch watch_reads)))\n" >> "$S/vendor_sepolicy.cil"
          fi
          VE
          cat << 'AR' > "$FAG/vendor/etc/init/init.churro.atlas.rc"
          on early-init
              setprop ro.sf.lcd_density 160
              setprop persist.sys.dpi 160
              setprop persist.aicore.enabled false
          on post-fs-data
              mkdir /data/adb 0700 root root
              mkdir /data/adb/ksu 0700 root root
              mkdir /data/adb/ksu/bin 0700 root root
              copy /vendor/ksu/ksud /data/adb/ksud
              copy /vendor/ksu/ksud /data/adb/ksu/bin/ksud
              chmod 0755 /data/adb/ksud
              chmod 0755 /data/adb/ksu/bin/ksud
          on property:sys.boot_completed=1
              setprop persist.bluetooth.a2dp_offload.disabled false
              setprop persist.sys.sf.disable_blurs 0
              setprop service.adb.tcp.port 5555
              setprop persist.adb.tcp.port 5555
              write /sys/power/mem_sleep deep
              chmod 0666 /sys/class/leds/chromeos::kbd_backlight/brightness
              write /sys/class/leds/chromeos::kbd_backlight/brightness 40
              exec u:r:get_variant_audio:s0 -- /vendor/bin/churro-mixer 0
              exec u:r:get_variant_audio:s0 -- /vendor/bin/churro-mixer 1
              exec u:r:get_variant_audio:s0 -- /vendor/bin/churro-mixer 2
              copy /vendor/ksu/manager.apk /data/local/tmp/ksu-manager.apk
              chmod 0644 /data/local/tmp/ksu-manager.apk
              exec - root root -- /system/bin/pm install -r /data/local/tmp/ksu-manager.apk
              start churro_kbd
          service churro_kbd /vendor/bin/churro-kbd
              class late_start
              user root
              group root input system
              disabled
              seclabel u:r:get_variant_audio:s0
          AR
      - name: Build Project Churro Image
        env:
          OTA: ${{ inputs.apply_latest_ota }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          export LLVM_CONFIG=/usr/bin/llvm-config-18
          W="$GITHUB_WORKSPACE/cb"
          cd "$W/project-churro"
          CAT="$(curl -fsSL https://dl.google.com/dl/edgedl/device/recovery/production_recovery.json || true)"
          RURL="$(echo "$CAT" | jq -r '.[] | select(.device=="ruby" or .model=="ruby" or (.url | contains("ruby"))) | .url' | head -n1 || true)"
          [ -z "$RURL" ] || [ "$RURL" = "null" ] && RURL="https://dl.google.com/device/recovery/ruby-user/16452207/recovery.zip"
          curl -fL "$RURL" -o "$W/recovery.zip"
          unzip -p "$W/recovery.zip" > "$W/recovery.bin" && rm -f "$W/recovery.zip"
          BIN="$W/recovery.bin"
          if [ "${OTA}" = "1" ] && [ -x "tools/updater/ota-check.sh" ]; then
            STEP=1
            while ./tools/updater/ota-check.sh "$BIN" 2>&1; do
              NBIN="$W/recovery_ota_${STEP}.bin"
              ./tools/updater/ota-update.sh "$BIN" --bin "$NBIN" || break
              rm -f "$BIN" && BIN="$NBIN" && STEP=$((STEP + 1))
            done
          fi
          mkdir -p out
          cp -f features/audio-generic/vendor/ksu/manager.apk out/KernelSU_Manager.apk 2>/dev/null || true
          IMG="churro-pixelbook-go-atlas.img"
          yes "" | sudo -E ./churro.sh auto "$BIN" "out/$IMG" || sudo -E ./churro.sh auto "$BIN" "out/$IMG" <<< ""
          rm -f "$BIN" && sudo rm -rf /var/cache/churro 2>/dev/null || true
          cd out && pigz -p "$(nproc)" -c "$IMG" | split -b 1900M - "$IMG.gz.part-" && rm -f "$IMG" && ls -lh "$IMG.gz.part-"*
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: churro-atlas-${{ github.run_number }}
          name: "Project Churro for Pixelbook Go (ATLAS) — Build #${{ github.run_number }}"
          body: "Project Churro (Android 17) for Pixelbook Go (ATLAS) with Audio, Mic, Keyboard Backlight, Blur, Deep Sleep & KernelSU."
          files: |
            cb/project-churro/out/churro-pixelbook-go-atlas.img.gz.part-*
            cb/project-churro/out/KernelSU_Manager.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
