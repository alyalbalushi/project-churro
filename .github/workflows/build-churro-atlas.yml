name: Build Project Churro for Pixelbook Go (ATLAS)
on:
  workflow_dispatch:
    inputs:
      apply_latest_ota:
        description: 'Apply Latest Google OTA Delta Before Building'
        required: true
        default: '1'
        type: choice
        options: ['1', '0']
permissions:
  contents: write
jobs:
  build-churro-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Maximize Free Disk Space (~100 GB Free)
      run: |
        sudo swapoff -a || true
        sudo rm -rf /mnt/swapfile /swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache /usr/local/aws-cli /usr/local/share/chromium /usr/lib/jvm
        sudo docker system prune -a -f --volumes || true
        sudo apt-get clean && df -h
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Install & Verify Project Churro, LLVM 18 & SPIRV-Tools Dependencies
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf >/dev/null || true
        sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
        sudo apt-get -o Acquire::Retries=5 -o Acquire::Check-Valid-Until=false update
        sudo apt-get -o Acquire::Retries=5 install -y --fix-missing \
          gdisk dosfstools parted grub-common grub-efi-amd64-bin cpio attr kmod openssl curl wget git unzip zip jq \
          python3 python3-pip python3-venv python3-mako python3-yaml python3-ply binutils lz4 zstd xz-utils bzip2 \
          build-essential flex bison bc rsync pkg-config cmake ninja-build meson libssl-dev libelf-dev libdw-dev \
          zlib1g-dev autoconf automake libtool liblz4-dev uuid-dev libselinux1-dev libsepol-dev checkpolicy secilc \
          default-jre-headless gettext autopoint gperf texinfo kpartx e2fsprogs erofs-utils mtools xorriso pigz \
          llvm-18-dev libclang-18-dev libclc-18-dev libllvmspirvlib-18-dev clang-18 spirv-tools spirv-headers \
          glslang-tools glslang-dev libdrm-dev libexpat1-dev
        sudo rm -rf /usr/lib/llvm-19 /usr/lib/llvm-20 /usr/lib/llvm-21 /usr/lib/llvm-22 /usr/bin/llvm-config-19 /usr/bin/llvm-config-20 /usr/bin/llvm-config-21 /usr/bin/llvm-config-22 2>/dev/null || true
        sudo ln -sf /usr/bin/llvm-config-18 /usr/bin/llvm-config
        pkg-config --exists --print-errors SPIRV-Tools LLVMSPIRVLib
    - name: Clone Project Churro & Pixelbook Go (ATLAS) Hardware Sources
      run: |
        set -euo pipefail
        WORKDIR="$GITHUB_WORKSPACE/churro-build"
        mkdir -p "$WORKDIR/deb-fw" && cd "$WORKDIR"
        git clone --depth 1 https://github.com/alesimula/project-churro.git
        git clone --depth 1 https://github.com/linuxkid473/gbos-x86.git
        git clone --depth 1 https://github.com/WeirdTreeThing/chromebook-linux-audio.git
        git clone --depth 1 https://github.com/WeirdTreeThing/alsa-ucm-conf-cros.git
        chmod +x "$WORKDIR/project-churro/churro.sh" "$WORKDIR/project-churro/"*/*.sh 2>/dev/null || true
        cd "$WORKDIR/deb-fw"
        for pkg in firmware-intel-sound firmware-intel-misc; do
          U="$(curl -fsSL --connect-timeout 10 "https://packages.debian.org/sid/all/$pkg/download" | grep -m1 -oE "https?://[^\"]+/${pkg}_[^\"]+_all\.deb" || true)"
          [ -n "$U" ] && curl -fL --connect-timeout 10 -o "$pkg.deb" "$U" && dpkg-deb -x "$pkg.deb" extracted && rm -f "$pkg.deb" || true
        done
    - name: Stage Pixelbook Go (ATLAS) Audio, Webcam, Bluetooth, Sleep, Display & KernelSU
      run: |
        set -euo pipefail
        WORKDIR="$GITHUB_WORKSPACE/churro-build"
        cd "$WORKDIR/project-churro"
        sed -i 's/libllvmspirvlib-18-dev/libllvmspirvlib-18-dev spirv-tools spirv-headers/' gfx/build-mesa.sh
        printf 'Y+=" KPROBES KRETPROBES HAVE_SYSCALL_TRACEPOINTS KSU KSU_X86_PATCH_SYSCALL_DISPATCHER"\nM+=" USB_VIDEO_CLASS VIDEO_IMX208 INTEL_SKL_INT3472 IPU_BRIDGE VIDEO_IPU3_CIO2 VIDEO_IPU3_IMGU SND_SOC_INTEL_AVS SND_SOC_INTEL_AVS_MACH_DA7219 SND_SOC_INTEL_AVS_MACH_DMIC SND_SOC_INTEL_AVS_MACH_HDAUDIO SND_SOC_INTEL_AVS_MACH_MAX98373 SND_SOC_INTEL_AVS_MACH_MAX98927 SND_SOC_MAX98373 SND_SOC_MAX98373_I2C SND_SOC_DA7219 MFD_CROS_EC_DEV CROS_EC CROS_EC_LPC LEDS_CROS_EC"\n' >> kmod/profiles/generic.conf
        cp -rf "$WORKDIR/gbos-x86/kernel/kernelsu" "$WORKDIR/project-churro/kmod/kernelsu"
        head -n 1 kmod/build-kernel.sh > kmod/build-kernel.sh.new
        cat << KSU_WRAP >> kmod/build-kernel.sh.new
        make() {
          for kdir in /var/cache/churro/src-*/common /var/cache/churro/src-* . ..; do
            [ -d "\$kdir" ] && touch "\$kdir/protected_module_names_list" "\$kdir/../protected_module_names_list" 2>/dev/null || true
            if [ -d "\$kdir/drivers" ] && [ -f "\$kdir/Makefile" ] && [ -f "$WORKDIR/project-churro/kmod/kernelsu/apply.sh" ]; then
              if [ ! -f "\$kdir/drivers/kernelsu/Kconfig" ]; then
                KSU_ABS="\$(cd "\$kdir" && pwd)"
                mkdir -p /build && ln -sfn "\$KSU_ABS" /build/src
                bash "$WORKDIR/project-churro/kmod/kernelsu/apply.sh" "\$KSU_ABS" || true
              fi
              for odir in "\$kdir"/out-* "\$kdir"; do
                if [ -f "\$odir/.config" ]; then
                  touch "\$odir/protected_module_names_list" "\$odir/../protected_module_names_list" 2>/dev/null || true
                  if ! grep -q "^CONFIG_KSU=y" "\$odir/.config"; then
                    if [ -x "\$kdir/scripts/config" ]; then
                      "\$kdir/scripts/config" --file "\$odir/.config" -e KPROBES -e KRETPROBES -e HAVE_SYSCALL_TRACEPOINTS -e KSU -e KSU_X86_PATCH_SYSCALL_DISPATCHER || true
                    else
                      printf "\nCONFIG_KPROBES=y\nCONFIG_KRETPROBES=y\nCONFIG_HAVE_SYSCALL_TRACEPOINTS=y\nCONFIG_KSU=y\nCONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y\n" >> "\$odir/.config"
                    fi
                  fi
                fi
              done
            fi
          done
          command make "\$@"
        }
        KSU_WRAP
        tail -n +2 kmod/build-kernel.sh >> kmod/build-kernel.sh.new
        mv -f kmod/build-kernel.sh.new kmod/build-kernel.sh
        chmod +x kmod/build-kernel.sh
        mkdir -p features/audio-generic/vendor/ksu
        cp -f "$WORKDIR/gbos-x86/usb/ksu/ksud" features/audio-generic/vendor/ksu/ksud 2>/dev/null || true
        cp -f "$WORKDIR/gbos-x86/usb/ksu/manager.apk" features/audio-generic/vendor/ksu/manager.apk 2>/dev/null || true
        python3 - "$WORKDIR/gbos-x86" << 'PY_KSU_DL'
        import json, os, re, sys, urllib.request
        kp, ap = "features/audio-generic/vendor/ksu/ksud", "features/audio-generic/vendor/ksu/manager.apk"
        if os.path.exists(kp) and os.path.exists(ap): sys.exit(0)
        ku = au = ""
        bsh = os.path.join(sys.argv[1], "build.sh")
        if os.path.exists(bsh):
            t = open(bsh).read()
            m1, m2 = re.search(r'https://github\.com/\S+?x86_64-linux-android-ksud', t), re.search(r'https://github\.com/\S+?\.apk', t)
            if m1: ku = m1.group(0).strip("'\"")
            if m2: au = m2.group(0).strip("'\"")
        if not ku or not au:
            req = urllib.request.Request("https://api.github.com/repos/tiann/KernelSU/releases/latest", headers={"User-Agent": "curl"})
            for a in json.loads(urllib.request.urlopen(req, timeout=15).read().decode()).get("assets", []):
                u = a.get("browser_download_url", "")
                if "x86_64-linux-android-ksud" in u and not ku: ku = u
                elif u.endswith(".apk") and not au: au = u
        if ku and not os.path.exists(kp): urllib.request.urlretrieve(ku, kp)
        if au and not os.path.exists(ap): urllib.request.urlretrieve(au, ap)
        PY_KSU_DL
        chmod 0755 features/audio-generic/vendor/ksu/ksud 2>/dev/null || true
        chmod 0644 features/audio-generic/vendor/ksu/manager.apk 2>/dev/null || true
        FW_DEST="features/firmware-extra/vendor/firmware/intel/avs"
        mkdir -p "$FW_DEST/skl" "$FW_DEST/kbl"
        cp -rf "$WORKDIR/deb-fw/extracted/usr/lib/firmware/intel/avs/"* "$FW_DEST/" 2>/dev/null || true
        cp -f "$WORKDIR/deb-fw/extracted/usr/lib/firmware/intel/"*ipu3* "$WORKDIR/deb-fw/extracted/usr/lib/firmware/intel/"*irci* "features/firmware-extra/vendor/firmware/intel/" 2>/dev/null || true
        cp -rf "$WORKDIR/chromebook-linux-audio/blobs/avs/"* "$FW_DEST/" 2>/dev/null || true
        [ -f "$FW_DEST/skl/dsp_basefw.bin" ] && [ ! -f "$FW_DEST/kbl/dsp_basefw.bin" ] && cp -f "$FW_DEST/skl/dsp_basefw.bin" "$FW_DEST/kbl/dsp_basefw.bin" || true
        [ -f "$FW_DEST/hda-80862809-tplg.bin" ] && [ ! -f "$FW_DEST/hda-8086280b-tplg.bin" ] && cp -f "$FW_DEST/hda-80862809-tplg.bin" "$FW_DEST/hda-8086280b-tplg.bin" || true
        rm -rf "$WORKDIR/deb-fw" "$WORKDIR/chromebook-linux-audio" "$WORKDIR/alsa-ucm-conf-cros" "$WORKDIR/gbos-x86"
        printf 'echo "options snd_intel_dspcfg dsp_driver=4" >> "$D/modules.options"\necho "options snd_soc_avs ignore_fw_version=1" >> "$D/modules.options"\necho "softdep snd_soc_avs pre: uvcvideo videobuf2_vmalloc videobuf2_v4l2 videobuf2_common intel_skl_int3472_discrete ipu_bridge imx208 ipu3_cio2 ipu3_imgu snd_soc_dmic snd_soc_max98373 snd_soc_max98373_i2c snd_soc_da7219 snd_hda_codec_hdmi snd_soc_avs_dmic snd_soc_avs_max98373 snd_soc_avs_da7219 snd_soc_avs_hdaudio cros_ec_lpcs cros_ec_dev leds_cros_ec" >> "$D/modules.softdep"\necho "softdep ipu3_cio2 pre: intel_skl_int3472_discrete ipu_bridge imx208" >> "$D/modules.softdep"\n' >> features/audio-generic/patch-vendor_dlkm.sh
        cat << 'KBD_C' > features/audio-generic/churro-kbd.c
        #include <dirent.h>
        #include <fcntl.h>
        #include <linux/input.h>
        #include <poll.h>
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #include <unistd.h>
        #define BL_P "/sys/class/leds/chromeos::kbd_backlight/brightness"
        #define MX_P "/sys/class/leds/chromeos::kbd_backlight/max_brightness"
        static int r_int(const char *p, int d) { int fd = open(p, O_RDONLY); if (fd < 0) return d; char b[32] = {0}; int n = read(fd, b, 31); close(fd); return n > 0 ? atoi(b) : d; }
        static void w_int(const char *p, int v) { int fd = open(p, O_WRONLY); if (fd < 0) return; char b[32]; int n = snprintf(b, sizeof(b), "%d\n", v); write(fd, b, n); close(fd); }
        int main(void) {
            if (access(BL_P, F_OK) != 0) return 0;
            int max_b = r_int(MX_P, 100); if (max_b <= 0) max_b = 100;
            int step = max_b / 5 > 0 ? max_b / 5 : 1, nfds = 0, mod = 0;
            struct pollfd pfds[32]; DIR *d = opendir("/dev/input"); if (!d) return 0;
            struct dirent *de;
            while ((de = readdir(d)) && nfds < 32) {
                if (!strncmp(de->d_name, "event", 5)) {
                    char p[64]; snprintf(p, sizeof(p), "/dev/input/%s", de->d_name);
                    int fd = open(p, O_RDONLY | O_NONBLOCK);
                    if (fd >= 0) { pfds[nfds].fd = fd; pfds[nfds++].events = POLLIN; }
                }
            }
            closedir(d);
            while (nfds > 0) {
                if (poll(pfds, nfds, -1) <= 0) continue;
                for (int i = 0; i < nfds; i++) {
                    if (pfds[i].fd < 0) continue;
                    if (pfds[i].revents & (POLLERR | POLLHUP | POLLNVAL)) { close(pfds[i].fd); pfds[i].fd = -1; continue; }
                    if (!(pfds[i].revents & POLLIN)) continue;
                    struct input_event ev;
                    while (read(pfds[i].fd, &ev, sizeof(ev)) == sizeof(ev)) {
                        if (ev.type != EV_KEY) continue;
                        if (ev.code == KEY_LEFTALT || ev.code == KEY_RIGHTALT || ev.code == KEY_LEFTMETA || ev.code == KEY_RIGHTMETA) mod = (ev.value != 0);
                        else if (ev.value == 1 || ev.value == 2) {
                            int c = r_int(BL_P, 40);
                            if (ev.code == KEY_KBDILLUMDOWN || (mod && (ev.code == KEY_F6 || ev.code == KEY_BRIGHTNESSDOWN))) w_int(BL_P, c - step < 0 ? 0 : c - step);
                            else if (ev.code == KEY_KBDILLUMUP || (mod && (ev.code == KEY_F7 || ev.code == KEY_BRIGHTNESSUP))) w_int(BL_P, c + step > max_b ? max_b : c + step);
                        }
                    }
                }
            }
            return 0;
        }
        KBD_C
        python3 - << 'PY_PATCHES'
        import re
        p = "features/audio-generic/get_variant_audio"
        s = open(p).read().replace("case $id in sof*)", "case $id in sof*|avs*|MAX98373*|DA7219*)")
        s = re.sub(r'.*churro-mixer.*', 'for c in /sys/class/sound/card[0-9]*; do /vendor/bin/churro-mixer "${c##*card}" 2>/dev/null || true; done', s)
        open(p, "w").write(s)
        p = "features/audio-generic/churro-mixer.c"
        s = open(p).read()
        sw = 'int sw = ((strstr(name, "Playback Switch") || strstr(name, "Speaker Switch") || strstr(name, "Spk") || strstr(name, "Headphone Switch") || strstr(name, "Sense") || strstr(name, "Enable Switch") || strstr(name, "DHT") || strstr(name, "BDE") || strstr(name, "DACL Switch") || strstr(name, "DACR Switch")) && !strstr(name, "Beep")) || !strcmp(name, "Capture Switch");'
        vol = 'int vol = !strcmp(name, "Master Playback Volume") || !strcmp(name, "DSP") || strstr(name, "Left Speaker") || strstr(name, "Right Speaker") || strstr(name, "Digital Volume") || strstr(name, "Speaker Gain") || strstr(name, "Headphone Volume") || strstr(name, "Capture Volume");'
        s = re.sub(r'int\s+sw\s*=[^;]+;', sw, s, count=1, flags=re.S)
        s = re.sub(r'int\s+vol\s*=[^;]+;', vol, s, count=1, flags=re.S)
        open(p, "w").write(s)
        p = "features/audio-generic/patch-vendor.sh"
        s = open(p).read()
        extra_mk = []
        for card_line in ['mk avsmax98373 "avs_max98373" 0', 'mk MAX98373 "AVS I2S MAX98373" 0', 'mk avsda7219 "avs_da7219" 0', 'mk DA7219 "AVS I2S DA7219" 0']:
            cname = card_line.split()[1]
            if f"mk {cname} " not in s:
                extra_mk.append(card_line)
        if extra_mk:
            s = re.sub(r'(mk\s+sofhdadsp\s+sof-hda-dsp[^\n]*)', lambda m: m.group(1) + "\n" + "\n".join(extra_mk), s, count=1)
        open(p, "w").write(s)
        p = "lib/esp.sh"
        s = open(p).read()
        extra = " snd_intel_dspcfg.dsp_driver=4 mem_sleep_default=deep i915.enable_psr=0 i915.enable_fbc=0"
        s = re.sub(r'^.*linux\s+.*kernel[^\n]*', lambda m: m.group(0) if "mem_sleep_default=deep" in m.group(0) else m.group(0) + extra, s, flags=re.M)
        open(p, "w").write(s)
        PY_PATCHES
        cat << 'VENDOR_EOF' >> features/audio-generic/patch-vendor.sh
        if [ -f "$T/lib64/iHD_drv_video.so" ] && [ ! -e "$T/lib64/i965_drv_video.so" ]; then
          ln -sfn iHD_drv_video.so "$T/lib64/i965_drv_video.so"
          setfattr -h -n security.selinux -v u:object_r:same_process_hal_file:s0 "$T/lib64/i965_drv_video.so" 2>/dev/null || true
        fi
        if [ -f "$T/build.prop" ]; then
          BP_CTX="$(getfattr -n security.selinux --only-values "$T/build.prop" 2>/dev/null || echo 'u:object_r:vendor_file:s0')"
          sed -i '/^ro\.surface_flinger\.supports_background_blur=/d; /^ro\.sf\.blurs_are_expensive=/d; /^ro\.launcher\.blur\.appLaunch=/d; /^persist\.sys\.sf\.disable_blurs=/d; /^persist\.bluetooth\.a2dp_offload\.disabled=/d' "$T/build.prop"
          printf "ro.surface_flinger.supports_background_blur=1\nro.sf.blurs_are_expensive=0\nro.launcher.blur.appLaunch=1\npersist.sys.sf.disable_blurs=0\npersist.bluetooth.a2dp_offload.disabled=false\n" >> "$T/build.prop"
          setfattr -n security.selinux -v "$BP_CTX" "$T/build.prop" 2>/dev/null || true
        fi
        python3 - "$A" << 'PY_XML'
        import os, re, sys
        for d in os.listdir(sys.argv[1]):
            cp = os.path.join(sys.argv[1], d, "audio_config.xml")
            if os.path.isfile(cp) and any(k in d for k in ["sof-rt5682", "avs", "MAX98373", "DA7219"]):
                s = open(cp).read()
                s = re.sub(r'(<Speaker>\s*<PlaybackPCM>)[^<]+(</PlaybackPCM>)', lambda m: m.group(1) + "hw:sofrt5682,0" + m.group(2), s, flags=re.S)
                s = re.sub(r'(<InternalMic>\s*<CapturePCM>)[^<]+(</CapturePCM>)', lambda m: m.group(1) + "hw:0,0" + m.group(2), s, flags=re.S)
                s = re.sub(r'(<Headphone>\s*<PlaybackPCM>)[^<]+(</PlaybackPCM>)', lambda m: m.group(1) + "hw:2,0" + m.group(2), s, flags=re.S)
                s = re.sub(r'(<Mic>\s*<CapturePCM>)[^<]+(</CapturePCM>)', lambda m: m.group(1) + "hw:2,0" + m.group(2), s, flags=re.S)
                open(cp, "w").write(s)
        PY_XML
        find "$A" "$T/etc/init" "$T/ksu" -exec setfattr -h -n security.selinux -v u:object_r:vendor_configs_file:s0 {} \; 2>/dev/null || true
        if [ -f "$F/churro-kbd.c" ]; then
          gcc -O2 -static -o "$T/bin/churro-kbd" "$F/churro-kbd.c"
          chmod 0755 "$T/bin/churro-kbd"
          setfattr -n security.selinux -v u:object_r:get_variant_audio_exec:s0 "$T/bin/churro-kbd" 2>/dev/null || true
        fi
        if [ -f "$S/vendor_sepolicy.cil" ]; then
          cat << 'CIL_EOF' >> "$S/vendor_sepolicy.cil"
        (allow get_variant_audio input_device (dir (ioctl read getattr lock open watch watch_reads search)))
        (allow get_variant_audio input_device (chr_file (ioctl read getattr lock open watch watch_reads)))
        (allow get_variant_audio sysfs (dir (ioctl read getattr lock open watch watch_reads search)))
        (allow get_variant_audio sysfs (file (ioctl read write getattr lock append map open watch watch_reads)))
        (allow get_variant_audio sysfs (lnk_file (ioctl read getattr lock map open watch watch_reads)))
        (allow get_variant_audio sysfs_leds (dir (ioctl read getattr lock open watch watch_reads search)))
        (allow get_variant_audio sysfs_leds (file (ioctl read write getattr lock append map open watch watch_reads)))
        (allow get_variant_audio sysfs_leds (lnk_file (ioctl read getattr lock map open watch watch_reads)))
        CIL_EOF
        fi
        VENDOR_EOF
        mkdir -p features/audio-generic/vendor/etc/init
        cat << 'ATLAS_RC' > features/audio-generic/vendor/etc/init/init.churro.atlas.rc
        on early-init
            setprop ro.sf.lcd_density 160
            setprop persist.sys.dpi 160
            setprop persist.aicore.enabled false
        on post-fs-data
            mkdir /data/adb 0700 root root
            mkdir /data/adb/ksu 0700 root root
            mkdir /data/adb/ksu/bin 0700 root root
            copy /vendor/ksu/ksud /data/adb/ksud
            copy /vendor/ksu/ksud /data/adb/ksu/bin/ksud
            chmod 0755 /data/adb/ksud
            chmod 0755 /data/adb/ksu/bin/ksud
            chown root root /data/adb/ksud
            chown root root /data/adb/ksu/bin/ksud
        on property:sys.boot_completed=1
            setprop persist.bluetooth.a2dp_offload.disabled false
            setprop persist.sys.sf.disable_blurs 0
            setprop service.adb.tcp.port 5555
            setprop persist.adb.tcp.port 5555
            write /sys/power/mem_sleep deep
            chmod 0666 /sys/class/leds/chromeos::kbd_backlight/brightness
            write /sys/class/leds/chromeos::kbd_backlight/brightness 40
            exec u:r:get_variant_audio:s0 -- /vendor/bin/sh -c "/vendor/bin/churro-mixer 0; /vendor/bin/churro-mixer 1; /vendor/bin/churro-mixer 2"
            copy /vendor/ksu/manager.apk /data/local/tmp/ksu-manager.apk
            chmod 0644 /data/local/tmp/ksu-manager.apk
            exec - root root -- /system/bin/pm install -r /data/local/tmp/ksu-manager.apk
            start churro_kbd
        service churro_kbd /vendor/bin/churro-kbd
            class late_start
            user root
            group root input system
            disabled
      
