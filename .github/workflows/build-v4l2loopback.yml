name: Build v4l2loopback.ko for Pixelbook Go (ATLAS)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-v4l2loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install Build Tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl bc bison flex libssl-dev libelf-dev zlib1g-dev libdw-dev liblz4-dev pkg-config openssl rsync dwarves python3 kmod cpio xz-utils zstd lz4 make gcc clang lld llvm
      - name: Build v4l2loopback.ko for GKI 6.18.21 (ab16302624)
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE/v4l2build"
          mkdir -p "$W/src" "$W/out" "$W/clang"
          BID="16302624"
          REL="6.18.21-android17-5-g3938c8d97142-ab16302624"
          CI="https://ci.android.com/builds/submitted/$BID/kernel_x86_64/latest/raw"

          echo ">> Checking Project Churro for exact Android Clang 22 URL..."
          git clone --depth 1 https://github.com/alesimula/project-churro.git "$W/churro"
          CLANG_URL="$(python3 - "$W/churro" << 'PY'
          import os, re, sys
          root = sys.argv[1]
          for rel in ["versions.env", "kmod/build-kernel.sh"]:
              p = os.path.join(root, rel)
              if not os.path.exists(p): continue
              s = open(p).read()
              m = re.search(r'https://[^\s"\']*clang-r[0-9a-zA-Z._-]+[^\s"\']*\.tar\.(?:gz|xz|zst)', s)
              if m:
                  print(m.group(0))
                  sys.exit(0)
          PY
          )"
          if [ -n "$CLANG_URL" ]; then
            echo ">> Downloading Project Churro Clang: $CLANG_URL"
            if curl -fsSL "$CLANG_URL" -o "$W/clang.tar"; then
              tar -xf "$W/clang.tar" -C "$W/clang"
              CLANG_BIN="$(find "$W/clang" -maxdepth 4 -type f -name clang -printf '%h\n' | head -n 1 || true)"
              if [ -n "$CLANG_BIN" ]; then
                export PATH="$CLANG_BIN:$PATH"
                echo ">> Using Android Clang from $CLANG_BIN"
              fi
            fi
          fi

          echo ">> Toolchain versions:"
          clang --version | head -n 1
          pahole --version

          echo ">> Cloning GKI kernel/common @ 3938c8d97142..."
          git init "$W/src"
          git -C "$W/src" remote add origin https://android.googlesource.com/kernel/common
          git -C "$W/src" fetch --depth 1 origin 3938c8d97142d5cf31543aa96f864a2cf832dda0
          git -C "$W/src" checkout FETCH_HEAD

          echo ">> Cloning and patching v4l2loopback (MJPEG depth=16 for Android)..."
          git clone --depth 1 https://github.com/v4l2loopback/v4l2loopback.git "$W/v4l2loopback"
          python3 - "$W/v4l2loopback/v4l2loopback_formats.h" << 'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s2 = re.sub(
              r'(\.fourcc\s*=\s*V4L2_PIX_FMT_MJPEG\s*,\s*\.depth\s*=\s*)32',
              r'\g<1>16',
              s,
              count=1,
              flags=re.S,
          )
          assert s2 != s, "MJPEG depth=32 entry not found in v4l2loopback_formats.h"
          open(p, "w").write(s2)
          print(">> Patched V4L2_PIX_FMT_MJPEG depth 32 -> 16")
          PY

          echo ">> Configuring GKI 6.18.21 (matching running atlas kernel + kCFI integer normalization)..."
          cd "$W/src"
          touch protected_module_names_list "$W/out/protected_module_names_list"
          make ARCH=x86_64 LLVM=1 LLVM_IAS=1 O="$W/out" gki_defconfig
          ./scripts/config --file "$W/out/.config" \
            --set-str LOCALVERSION "-android17-5-g3938c8d97142-ab16302624" \
            -d LOCALVERSION_AUTO \
            -d RUST \
            -d WERROR \
            -d LTO_CLANG_THIN \
            -d LTO_CLANG_FULL \
            -e LTO_NONE \
            -e CFI_CLANG \
            -e CFI \
            -e CFI_ICALL_NORMALIZE_INTEGERS \
            -e DEBUG_INFO_DWARF5 \
            -e DEBUG_INFO_BTF \
            -e DEBUG_INFO_BTF_MODULES \
            -e MODULE_SIG \
            -e MODULE_SIG_ALL \
            -e MODULE_SIG_FORMAT \
            -e MODULE_SIG_PROTECT \
            --set-str MODULE_SIG_PROTECT_LIST "protected_module_names_list" \
            -e KPROBES \
            -e KRETPROBES \
            -e HAVE_SYSCALL_TRACEPOINTS \
            -e MODULES \
            -e MODVERSIONS \
            -e MEDIA_SUPPORT \
            -e VIDEO_DEV
          make ARCH=x86_64 LLVM=1 LLVM_IAS=1 O="$W/out" olddefconfig

          echo ">> Verifying struct module + kCFI config flags:"
          grep -E '^(CONFIG_MODULE_SIG|CONFIG_DEBUG_INFO_BTF|CONFIG_CFI|CONFIG_LTO|CONFIG_KPROBES|CONFIG_MODVERSIONS)' "$W/out/.config" | sort
          grep -q '^CONFIG_CFI_ICALL_NORMALIZE_INTEGERS=y$' "$W/out/.config" || { echo "FATAL: CONFIG_CFI_ICALL_NORMALIZE_INTEGERS not enabled!"; exit 1; }

          echo ">> Running prepare (-j1)..."
          make ARCH=x86_64 LLVM=1 LLVM_IAS=1 O="$W/out" -j1 prepare

          echo ">> Fetching or generating Module.symvers..."
          if curl -fsSL "$CI/vmlinux.symvers" -o "$W/out/Module.symvers" || curl -fsSL "$CI/Module.symvers" -o "$W/out/Module.symvers"; then
            echo ">> Downloaded official GKI symvers"
            make ARCH=x86_64 LLVM=1 LLVM_IAS=1 O="$W/out" -j"$(nproc)" modules_prepare
          else
            echo ">> Generating Module.symvers locally from GKI vmlinux (~3-4 min)..."
            make ARCH=x86_64 LLVM=1 LLVM_IAS=1 O="$W/out" -j"$(nproc)" vmlinux
          fi

          echo ">> Compiling v4l2loopback.ko..."
          make ARCH=x86_64 LLVM=1 LLVM_IAS=1 O="$W/out" M="$W/v4l2loopback" KBUILD_MODPOST_WARN=1 -j"$(nproc)" modules

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$W/v4l2loopback/v4l2loopback.ko" "$GITHUB_WORKSPACE/release/v4l2loopback.ko"
          modinfo "$GITHUB_WORKSPACE/release/v4l2loopback.ko"
          readelf -S "$GITHUB_WORKSPACE/release/v4l2loopback.ko" | grep this_module || true
          modinfo "$GITHUB_WORKSPACE/release/v4l2loopback.ko" | grep -q "vermagic:.*$REL"
      - name: Upload v4l2loopback.ko Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4l2loopback-atlas-${{ github.run_number }}
          name: "v4l2loopback.ko for Pixelbook Go (ATLAS) — Build #${{ github.run_number }}"
          body: "MJPEG-patched v4l2loopback.ko for Project Churro GKI 6.18.21-android17-5-g3938c8d97142-ab16302624 (kCFI normalize-integers + BTF + MODULE_SIG + KPROBES matched)."
          files: |
            release/v4l2loopback.ko
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
