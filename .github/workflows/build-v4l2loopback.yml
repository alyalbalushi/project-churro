name: Build v4l2loopback.ko for Pixelbook Go (ATLAS)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-v4l2loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install Build Tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git curl bc bison flex libssl-dev libelf-dev python3 kmod cpio xz-utils zstd lz4 make gcc clang lld llvm
      - name: Build v4l2loopback.ko for GKI 6.18.21 (ab16302624)
        run: |
          set -euo pipefail
          W="$GITHUB_WORKSPACE/v4l2build"
          mkdir -p "$W/src" "$W/out"
          BID="16302624"
          REL="6.18.21-android17-5-g3938c8d97142-ab16302624"
          CI="https://ci.android.com/builds/submitted/$BID/kernel_x86_64/latest/raw"

          echo ">> Cloning GKI kernel/common @ 3938c8d97142..."
          git init "$W/src"
          git -C "$W/src" remote add origin https://android.googlesource.com/kernel/common
          git -C "$W/src" fetch --depth 1 origin 3938c8d97142d5cf31543aa96f864a2cf832dda0
          git -C "$W/src" checkout FETCH_HEAD

          echo ">> Cloning and patching v4l2loopback (MJPEG depth=16 for Android)..."
          git clone --depth 1 https://github.com/v4l2loopback/v4l2loopback.git "$W/v4l2loopback"
          python3 - "$W/v4l2loopback/v4l2loopback_formats.h" << 'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s2 = re.sub(
              r'(\.fourcc\s*=\s*V4L2_PIX_FMT_MJPEG\s*,\s*\.depth\s*=\s*)32',
              r'\g<1>16',
              s,
              count=1,
              flags=re.S,
          )
          assert s2 != s, "MJPEG depth=32 entry not found in v4l2loopback_formats.h"
          open(p, "w").write(s2)
          print(">> Patched V4L2_PIX_FMT_MJPEG depth 32 -> 16")
          PY

          echo ">> Configuring GKI 6.18.21..."
          cd "$W/src"
          touch protected_module_names_list "$W/out/protected_module_names_list"
          make ARCH=x86_64 LLVM=1 LLVM_IAS=1 O="$W/out" gki_defconfig
          ./scripts/config --file "$W/out/.config" \
            --set-str LOCALVERSION "-android17-5-g3938c8d97142-ab16302624" \
            -d LOCALVERSION_AUTO \
            -d RUST \
            -d DEBUG_INFO_BTF \
            -d DEBUG_INFO \
            -d WERROR \
            -e MODULES \
            -e MODVERSIONS \
            -e MEDIA_SUPPORT \
            -e VIDEO_DEV
          make ARCH=x86_64 LLVM=1 LLVM_IAS=1 O="$W/out" olddefconfig

          echo ">> Fetching or generating Module.symvers..."
          if curl -fsSL "$CI/vmlinux.symvers" -o "$W/out/Module.symvers" || curl -fsSL "$CI/Module.symvers" -o "$W/out/Module.symvers"; then
            echo ">> Downloaded official GKI symvers"
            make ARCH=x86_64 LLVM=1 LLVM_IAS=1 O="$W/out" -j"$(nproc)" modules_prepare
          else
            echo ">> Generating Module.symvers locally from GKI vmlinux (~3-4 min)..."
            make ARCH=x86_64 LLVM=1 LLVM_IAS=1 O="$W/out" -j"$(nproc)" vmlinux
          fi

          echo ">> Compiling v4l2loopback.ko..."
          make ARCH=x86_64 LLVM=1 LLVM_IAS=1 O="$W/out" M="$W/v4l2loopback" KBUILD_MODPOST_WARN=1 -j"$(nproc)" modules

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$W/v4l2loopback/v4l2loopback.ko" "$GITHUB_WORKSPACE/release/v4l2loopback.ko"
          modinfo "$GITHUB_WORKSPACE/release/v4l2loopback.ko"
          modinfo "$GITHUB_WORKSPACE/release/v4l2loopback.ko" | grep -q "vermagic:.*$REL"
      - name: Upload v4l2loopback.ko Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4l2loopback-atlas-${{ github.run_number }}
          name: "v4l2loopback.ko for Pixelbook Go (ATLAS) — Build #${{ github.run_number }}"
          body: "MJPEG-patched v4l2loopback.ko for Project Churro GKI 6.18.21-android17-5-g3938c8d97142-ab16302624."
          files: |
            release/v4l2loopback.ko
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
